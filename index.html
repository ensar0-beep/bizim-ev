<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bizim Ev">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bizim Ev</title>
<meta name="description" content="Ailenin takvimi, görevleri ve listeleri tek yerde.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Telefonda tam ekran uygulama, altta 5 sekmeli menü; geniş ekranda ortada telefon genişliğinde bir çerçeve */
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --sunk:#F2EEE8; --line:#E4DED4; --fg:#22201D; --muted:#625B52;
  --accent:#2E6A51; --on-accent:#FFFFFF; --accent-soft:#E1EDE6; --accent-ink:#22533F;
  --coral:#B9502F; --coral-soft:#FBE9E2; --on-coral:#FFFFFF; --danger:#B3261E; --danger-soft:#FBE4E2; --warn:#7D5200; --warn-soft:#FFF0D2;
  --stage:#ECE7DF; --scrim:rgba(30,24,18,.38);
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16140F; --surface:#211E19; --sunk:#2B2721; --line:#3B362E; --fg:#F2EDE5; --muted:#ADA497;
  --accent:#8BCBA9; --on-accent:#0D2419; --accent-soft:#1F342A; --accent-ink:#A5DABD;
  --coral:#F29A80; --coral-soft:#3A251E; --on-coral:#2A140C; --danger:#F3A69F; --danger-soft:#3E201D; --warn:#F2C46E; --warn-soft:#3A2E15;
  --stage:#0D0C0A; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16140F; --surface:#211E19; --sunk:#2B2721; --line:#3B362E; --fg:#F2EDE5; --muted:#ADA497;
  --accent:#8BCBA9; --on-accent:#0D2419; --accent-soft:#1F342A; --accent-ink:#A5DABD;
  --coral:#F29A80; --coral-soft:#3A251E; --on-coral:#2A140C; --danger:#F3A69F; --danger-soft:#3E201D; --warn:#F2C46E; --warn-soft:#3A2E15;
  --stage:#0D0C0A; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}
html.big{font-size:125%}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:var(--stage);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:1.375rem;height:1.375rem;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:1.05rem;height:1.05rem}

.stage{height:100%;display:flex;justify-content:center;align-items:center}
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
/* Telefonda sayfa kaymasın; klavye kapandıktan sonra bir boşluk kalırsa da sayfayla aynı renkte görünsün */
@media (max-width:639px){body{background:var(--bg)}}
@media (min-width:640px){.phone{width:400px;height:min(860px,calc(100% - 48px));border-radius:36px;box-shadow:var(--shadow),0 0 0 10px var(--surface),0 0 0 11px var(--line)}}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 110px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.hdr .h{min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px;font-size:.95rem}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:1.125rem;margin:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:26px 0 8px}
.link{color:var(--accent-ink);font-weight:600;font-size:.95rem;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:4px}
:root[data-theme="dark"] .link{color:var(--accent)}

.btn{min-height:48px;padding:0 18px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:.95rem}
.icon-btn{width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk)}
[aria-disabled="true"]{opacity:.45}

.av{--c:#888;width:2rem;height:2rem;border-radius:999px;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex:none}
.av.lg{width:3.25rem;height:3.25rem;font-size:1.25rem}
.av.xl{width:5rem;height:5rem;font-size:1.8rem}
.av.xs{width:1.5rem;height:1.5rem;font-size:.7rem}
.avs{display:flex;flex:none}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-left:-8px}
/* Avatar görseli: kişinin renginin açık tonu üstünde, renkli halkayla */
.av.pic{overflow:hidden;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:2px solid var(--c)}
.av.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block;transform:translateY(6%) scale(1.06)}
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;border:1.5px solid var(--line);font-size:.72rem;font-weight:600;color:var(--muted);min-height:44px}
.avg button .av{width:3rem;height:3rem;font-size:1.1rem}
.avg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.swg{display:flex;flex-wrap:wrap;gap:10px}
.swg button{width:44px;height:44px;border-radius:999px;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 0 0 3px var(--surface);border:2px solid transparent}
.swg button[aria-pressed="true"]{border-color:var(--c)}
/* Alt sayfa açıkken bildirim üstteki boşlukta (sayfa en fazla ekranın 72px altına kadar uzar) */
.sheet{max-height:min(92%,calc(100% - 72px))}
.toast.top{top:10px;bottom:auto}
/* Alt sayfayı çizgiden ya da başlığından tutup aşağı çekerek kapatma */
.sheet .grip{box-sizing:content-box;padding:10px 60px 6px;margin:0 auto;background-clip:content-box;cursor:grab}
/* Satırı kaydırma: sağ = tamam, sol = sil */
.group{position:relative}
.row[data-sw],.lr[data-sw]{touch-action:pan-y}
.row.swiping,.lr.swiping{z-index:1;background:var(--surface)}
.swbg{position:absolute;left:0;right:0;z-index:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:.9rem}
.swbg span{display:inline-flex;align-items:center;gap:6px;opacity:.55;transition:opacity .15s,transform .15s}
.swbg.ok{background:var(--accent);color:var(--on-accent)}.swbg.ok span+span{visibility:hidden}
.swbg.del{background:var(--danger);color:var(--surface)}.swbg.del span:first-child{visibility:hidden}
.swbg.hot span{opacity:1;transform:scale(1.08)}
/* Sık eklenenler */
.sugg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 2px 2px}
.sugg small{color:var(--muted);font-weight:600;font-size:.8rem;margin-right:2px}
.row.shop{min-height:64px}.row.shop .t{font-size:1.08rem}
.sugg button{min-height:40px;padding:0 12px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:4px}
/* Görev kutlaması ve çocuklar için haftalık yıldız */
.cf{position:absolute;width:8px;height:10px;border-radius:2px;pointer-events:none;z-index:40}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);font-weight:700;padding:6px 12px;border-radius:999px;font-size:.9rem;margin:0 0 12px}
/* Takvim: üst çubuk, akış günleri, ay ayrıntısı, tatil etiketleri */
.ctop{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.ctop h1{flex:1}
.ctop .add,.add.rnd{width:42px;height:42px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.cvw{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.cvw button{width:40px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cvw button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cbar{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}.cbar>*{flex:none}
.cwho,.ctg{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px 0 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:.88rem}
.cwho .fam{transform:scale(.75);margin:-4px}
.cwho .avs .av{width:1.4rem;height:1.4rem}
.cwho.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.ctg{padding:0 12px;color:var(--muted)}
.ctg[aria-pressed="true"],.ctg.on{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.cday{margin-bottom:12px}
.cdh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:4px 4px 6px}
.cdh b{font-family:var(--f-display);font-size:1.05rem}
.cdh>span{color:var(--muted);font-size:.85rem}
.cday.today .cdh b{color:var(--coral)}
.cemp{color:var(--muted);font-size:.82rem;padding:2px 4px 12px 4px}
.ctk{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:4px 14px 4px 12px;text-align:left;position:relative;color:var(--muted);font-weight:600;font-size:.9rem}
.cr+.ctk::before{content:"";position:absolute;top:0;left:4.6rem;right:0;border-top:1px solid var(--line)}
.ctk .ck0{width:3rem;display:flex;justify-content:flex-end}
.ctk .b{flex:1;min-width:0;padding-left:1.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctk em{color:var(--danger);font-style:normal}
.ctk .avs .av{width:1.4rem;height:1.4rem}
.cmore{color:var(--muted);text-align:center;font-size:.85rem;padding:14px 0 24px}
.hol{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.hol.resmi{background:var(--danger-soft);color:var(--danger)}
.hol.okul{background:var(--warn-soft);color:var(--warn)}
.mdet{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow)}
.mdet .dow{font-size:.7rem;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.mdet .d{min-height:74px;border-radius:10px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px 2px;min-width:0;text-align:left}
.mdet .d .num{align-self:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;width:1.6rem;height:1.6rem;display:flex;align-items:center;justify-content:center;border-radius:999px}
.mdet .d.today .num{background:var(--coral);color:#fff}
.mdet .d.out{opacity:.35}
.mdet .d.rh .num{color:var(--danger)}
.mdet .d[aria-pressed="true"]{background:var(--accent-soft)}
.mdet .mb{display:block;font-size:.6rem;font-weight:600;line-height:1.25;padding:1px 3px;border-radius:4px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:clip}
.mdet .mb.hb{--c:var(--danger);background:var(--danger-soft);color:var(--danger)}
.mdet .mb.hb.okul{--c:var(--warn);background:var(--warn-soft);color:var(--warn)}
.mdet .mb.hb.gun{--c:var(--muted);background:var(--sunk);color:var(--muted)}
.mdet .mm,.mdet .mt{font-size:.6rem;color:var(--muted);font-weight:700;padding-left:3px}
.cr.past{opacity:.5}
.cdh .cadd{margin-left:auto;width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);align-self:center}
.cprev{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:40px;color:var(--muted);font-weight:600;font-size:.88rem;margin-bottom:8px}
/* Profilim: ortada büyük avatar, altında kısa özet */
.pfh{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:4px 0 16px}
.pfh .avedit{margin-bottom:8px}
.pfh .av.xl{width:5.5rem;height:5.5rem;box-shadow:0 0 0 4px var(--surface),0 0 0 6px color-mix(in srgb,var(--c) 40%,transparent)}
.pfh b{font-family:var(--f-display);font-size:1.45rem}
.pfh>span{color:var(--muted);font-size:.92rem}
.pfs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pfs div{background:var(--surface);border-radius:var(--r-md);padding:12px 8px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pfs b{display:block;font-family:var(--f-display);font-size:1.5rem}
.pfs span{display:block;color:var(--muted);font-size:.74rem;line-height:1.25;margin-top:2px}
.avedit{position:relative;display:inline-flex;border-radius:999px;flex:none}
.avedit .pen{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.avedit .pen .i{width:14px;height:14px}
.who{display:inline-flex;align-items:center;gap:6px}
.who .avs{margin-right:2px}
.av.wait{opacity:.4;filter:grayscale(1)}

/* Bugün */
.ann{background:var(--coral-soft);border-radius:var(--r-lg);padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.ann .ic{color:var(--coral);margin-top:2px}
.ann .txt{font-size:1.125rem;font-weight:600;line-height:1.35}
.ann .meta{color:var(--muted);font-size:.875rem;margin-top:6px}
.ann .body{flex:1;min-width:0}
/* Bugün başlığı: tarih, selam, tek + */
.th{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.th .h{flex:1;min-width:0}
.th .ov{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.th h1{font-size:1.65rem;margin-top:2px}
.th .add{width:42px;height:42px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
/* Bugün üst kısım: Gece göğü. Saate göre renk alan pano, Hicri tarih, ay evresi, sıradaki mübarek gün */
.thx{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:2px}
.thx .thbtn{grid-column:2;grid-row:1;display:flex;align-items:center;gap:10px}
.thx .r1{grid-column:1;grid-row:1;min-width:0}
.thx .full{grid-column:1/-1;min-width:0}
.mbtn{flex:none;padding:0;border-radius:999px;line-height:0;background:none}
.moon2{width:48px;height:48px;margin:-4px -4px -4px -8px}
.hchip{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 11px 5px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-size:.8rem;font-weight:600;max-width:100%}
.hchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hchip.on{background:var(--coral-soft);color:var(--coral)}
.thn .panel{grid-column:1/-1;position:relative;margin-top:8px;padding:14px 92px 14px 16px;border-radius:22px;background:linear-gradient(135deg,var(--s1),var(--s2));color:var(--sf);overflow:hidden;min-height:104px;display:flex;flex-direction:column;justify-content:center}
.thn .panel h1{color:inherit;margin:0;font-size:clamp(1.3rem,6vw,1.6rem);line-height:1.15}
.thn .panel .hj{color:inherit;opacity:.85;font-size:.88rem;margin-top:3px}
.thn .panel .mbtn{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.thn .panel .moon2{width:78px;height:78px;margin:0}
.thn .panel .hchip{background:rgba(255,255,255,.4);color:inherit;margin-top:8px}
.thn.sky-n{--moon-dark:rgba(10,14,36,.55)}.thn.sky-e{--moon-dark:rgba(62,35,64,.18)}
.thn.sky-n .hchip{background:rgba(255,255,255,.14)}
.thn .panel .hchip span{white-space:normal}
@media (max-width:359px){.thn .panel{padding-right:72px}.thn .panel .moon2{width:60px;height:60px}.thn .panel .mbtn{right:6px}}
.thn .st{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.85}
.sky-m{--s1:#FFE3C7;--s2:#FFF6E6;--sf:#4A2A12}.sky-d{--s1:#D6ECFA;--s2:#F2F8FC;--sf:#173A52}.sky-e{--s1:#F7C9B6;--s2:#E5D4F0;--sf:#3E2340}.sky-n{--s1:#1E2A4A;--s2:#36406B;--sf:#F1EEFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sky-m{--s1:#4A3320;--s2:#2E241B;--sf:#FFE9D2}:root:not([data-theme="light"]) .sky-d{--s1:#1C3A4F;--s2:#1A2730;--sf:#E2F2FC}:root:not([data-theme="light"]) .sky-e{--s1:#4D2E3A;--s2:#2F2840;--sf:#FBE6F0}}
:root[data-theme="dark"] .sky-m{--s1:#4A3320;--s2:#2E241B;--sf:#FFE9D2}:root[data-theme="dark"] .sky-d{--s1:#1C3A4F;--s2:#1A2730;--sf:#E2F2FC}:root[data-theme="dark"] .sky-e{--s1:#4D2E3A;--s2:#2F2840;--sf:#FBE6F0}
.thn{--moon-dark:var(--sunk)}
/* Panoda herkesin mesajı: tek satır, dokundukça sıradakine geçer (Apple Hava uyarıları gibi) */
.pstrip{grid-column:1/-1;position:relative;display:flex;align-items:center;border-radius:0 0 22px 22px;background:linear-gradient(135deg,var(--s1),var(--s2));color:var(--sf);border-top:1px solid rgba(0,0,0,.07)}
.pstrip::before{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.045);pointer-events:none}
.thn.sky-n .pstrip{border-top-color:rgba(255,255,255,.1)}.thn.sky-n .pstrip::before{background:rgba(0,0,0,.14)}
.pstrip>*{position:relative}
.pmc{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 4px 11px 14px;color:inherit;min-height:54px}
.pmc .in{display:flex;align-items:center;gap:10px;flex:1;min-width:0;animation:pmIn .3s ease}
.pmc .tx{flex:1;min-width:0;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pmc .tx b{font-weight:700;margin-right:5px}
.pmc .t{flex:none;font-size:.72rem;opacity:.7}
.pmc .dots{flex:none;display:flex;gap:4px}.pmc .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.3;transition:opacity .2s}.pmc .dots i.on{opacity:.85}
.pmw{flex:none;width:44px;height:44px;margin-right:4px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:inherit;opacity:.8}
@keyframes pmIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pmc .in{animation:none}}
.thn .panel.wa{border-radius:22px 22px 0 0}
.msgl{display:flex;flex-direction:column;margin-top:18px}.msgl>b{font-size:.82rem;color:var(--muted);margin-bottom:2px}
.msgl .r{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.msgl .r .b{flex:1;min-width:0}.msgl .r .h{font-size:.82rem;color:var(--muted)}.msgl .r .h b{color:var(--fg)}.msgl .r .x{margin-top:2px;overflow-wrap:anywhere}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .thn .panel .hchip{background:rgba(255,255,255,.12)}}:root[data-theme="dark"] .thn .panel .hchip{background:rgba(255,255,255,.12)}
/* Duyuru notu: sıcak kâğıt, hafif eğik, üstte yazanın avatarı raptiye gibi */
.lbl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 4px 8px}
.lbl>span{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
/* Sıradaki etkinlik */
.nx{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-lg);padding:16px 16px 16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.nx::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.nx .b{flex:1;min-width:0}
.nx .k{font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.nx .t{display:block;font-family:var(--f-display);font-size:1.3rem;font-weight:700;line-height:1.2;margin:4px 0 6px}
.nx .m{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.88rem}
.nx .m span{display:inline-flex;align-items:center;gap:4px;min-width:0}
/* Evde: alınacaklar ve aile fikri */
.cl{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tlempty{color:var(--muted);text-align:center;padding:22px 12px}
.hrow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 14px;text-align:left;position:relative}
.hrow+.hrow::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--line)}
.hrow .ic{width:36px;height:36px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:none}
.hrow .b{flex:1;min-width:0}.hrow .b b{display:block;font-weight:600}
.hrow .b small{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .n{font-weight:700;font-variant-numeric:tabular-nums}
.hrow .n.u{color:var(--danger);font-size:.8rem;font-weight:700;background:var(--danger-soft);border-radius:999px;padding:2px 8px}
.hrow>svg:last-child{color:var(--muted)}
.ann-empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--muted);width:100%;text-align:left;min-height:56px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.9rem;padding:8px 4px;text-align:center}
.qa button .ic{width:2.25rem;height:2.25rem;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}

.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;text-align:left;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;display:block;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.875rem;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;align-items:center}
.row .m span{display:inline-flex;align-items:center;gap:4px}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--sunk)}
.time{font-variant-numeric:tabular-nums;font-weight:700;width:3.4rem;flex:none;font-size:.95rem}
.time.ad{font-size:.78rem;font-weight:600;color:var(--muted);line-height:1.15}
.mbar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:4px}
.empty .btn{margin-top:12px}

.chk{width:48px;height:48px;margin:-6px -6px -6px -8px;display:flex;align-items:center;justify-content:center;flex:none}
.chk span{width:1.75rem;height:1.75rem;border-radius:999px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s}
.chk[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.rot{background:var(--accent-soft);color:var(--accent-ink)}
.tag.cat{background:var(--sunk);color:var(--fg);font-weight:600}
.tag.soon{background:var(--warn-soft);color:var(--warn)}
.tag.later{background:var(--sunk);color:var(--muted)}
.wic{width:40px;height:40px;border-radius:12px;background:var(--sunk);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);font-size:1.6rem;background:var(--surface)}
.moods button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.idea{background:var(--accent-soft);border-radius:var(--r-lg);padding:14px 16px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.idea .t{font-weight:700;display:block}
.idea .m{color:var(--muted);font-size:.875rem}

/* Segmented + chips */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--muted);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 14px 0 8px;border-radius:999px;border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;background:var(--surface);flex:none}
.chip.plain{padding:0 16px}
.kbr{flex-basis:100%;height:0}
/* Kişi seçimi: yuvarlak avatar, isim altta; çocuklar alt satırda biraz küçük. Seçilende yeşil halka ve tik. */
/* herkes tek satırda: sütunlar eşit paylaşılır; kişi sayısı artarsa alt satıra geçer */
/* hücre genişliği yazı boyuna bağlı: büyük yazıda üst üste binmek yerine alt satıra geçer */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(3rem,1fr));gap:12px 2px;align-items:start}
.pgrid .pp{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;max-width:100%;overflow-wrap:anywhere;font-size:.75rem;font-weight:600;color:var(--muted);padding:4px 0 2px;border-radius:14px;position:relative;line-height:1.15;text-align:center}
.pgrid .pp .av,.pgrid .pp .fam{width:2.4rem;height:2.4rem;font-size:1.05rem;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--line);transition:box-shadow .15s}
.pgrid .pp .fam svg{width:1.25rem;height:1.25rem}
.pgrid .pp.kid .av{width:2.1rem;height:2.1rem;margin:.15rem 0}
.pgrid .pp[aria-pressed="true"]{color:var(--fg)}
.pgrid .pp[aria-pressed="true"] .av,.pgrid .pp[aria-pressed="true"] .fam{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--accent)}
.pgrid .pp .ck{position:absolute;top:0;right:calc(50% - 1.55rem);width:20px;height:20px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.pgrid .pp[aria-pressed="true"] .ck{display:flex}
.pgrid .pp .ck .i{width:12px;height:12px}
.pgrid .link{align-self:center;grid-column:span 4;justify-self:start}
.pgrid .kbr{display:none}
.calpg{margin-top:12px}
/* Aile sekmesi: ayarlar sayfası grupları, davet/ekle satırlarının simgesi */
.setsec{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 6px 6px}
.setsec:first-child{margin-top:4px}
.av.addav{background:var(--accent-soft);color:var(--accent-ink)}
/* Tarih ve saat: telefonun kendi seçicisi görünmez katman olarak üstte; görünen yazıyı biz yazarız, böylece iPhone'da kutu taşmaz */
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.dtp{position:relative;display:flex;align-items:center;gap:8px;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-weight:600;min-width:0;overflow:hidden;color:var(--fg)}
.dtp .i{color:var(--muted);flex:none}
.dtp .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dtp .v.ph{color:var(--muted);font-weight:500}
.dtp input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;border:0;padding:0;-webkit-appearance:none;appearance:none;cursor:pointer}
.dtp:focus-within{border-color:var(--accent)}
.dtp.off{opacity:.45}
.chip.kid{min-height:40px;font-size:.9rem;padding-right:12px}
.chip.kid .av{width:1.3rem;height:1.3rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chip .n{font-size:.8rem;background:var(--sunk);border-radius:999px;padding:1px 7px;color:var(--fg)}
.chip .ord{font-size:.75rem;background:var(--accent);color:var(--on-accent);border-radius:999px;width:1.25rem;height:1.25rem;display:inline-flex;align-items:center;justify-content:center}

/* Takvim */
.calnav{display:flex;align-items:center;gap:4px;margin:14px 0 6px}
.calnav .title{flex:1;font-family:var(--f-display);font-weight:600;font-size:1.15rem;text-align:center}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--surface);border-radius:var(--r-lg);padding:8px;box-shadow:var(--shadow)}
.month .dow{font-size:.75rem;color:var(--muted);text-align:center;padding:4px 0;font-weight:600;letter-spacing:.03em}
.month .d{min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-variant-numeric:tabular-nums;font-weight:600}
.month .d.out{color:var(--muted);opacity:.55}
.month .d.today .num{background:var(--coral);color:#fff;border-radius:999px;width:1.75rem;height:1.75rem;display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .month .d.today .num{color:#2A140C}
.month .d[aria-pressed="true"]{background:var(--accent-soft)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--c)}
.daylbl{font-weight:700;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.daylbl small{color:var(--muted);font-weight:500;font-size:.85rem}

/* Listeler */
.addbar{display:flex;gap:8px;margin:12px 0 4px}
.addbar input{flex:1;min-width:0;min-height:52px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 18px;font-size:1.05rem}
.addbar input:focus{border-color:var(--accent);outline:none}
.catlbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 4px 6px}
.item{min-height:58px}
.qty{color:var(--muted);font-weight:500}
.donebar{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
/* Listeler: üstte büyük sekmeler (Alınacaklar | İsteklerimiz), altta çizgi ikonlu sekmeler (Airbnb gibi) */
.ltabs{display:flex;align-items:center;gap:10px;margin:2px -18px 4px;padding:0 18px;border-bottom:1px solid var(--line)}
.ltabs>.lt{position:relative;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:clamp(.9rem,4.2vw,1.1rem);white-space:nowrap;font-weight:700;color:var(--muted);opacity:.75;min-height:52px;flex:none}
.ltabs>.lt[aria-pressed="true"]{color:var(--fg);opacity:1}
.ltabs>.lt[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;border-radius:4px 4px 0 0;background:var(--accent)}
.ltabs>.lt em{font-style:normal;font-family:var(--f-body);font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 7px;background:var(--accent-soft);color:var(--accent-ink)}
.ltabs+.wtabs{margin-top:2px}
.ltabs .sp{flex:1;min-width:0}
.lbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;flex:none;background:var(--accent-soft);color:var(--accent-ink)}
.lbtn.pl{background:var(--accent);color:var(--on-accent)}
@media (max-width:359px){.ltabs{gap:8px}.lbtn{width:36px;height:36px}.ltabs>.lt em{display:none}}
.lbtn .n{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.wtabs{display:flex;border-bottom:1px solid var(--line);margin:4px -18px 10px;padding:0 14px;overflow-x:auto;scrollbar-width:none}.wtabs::-webkit-scrollbar{display:none}
.wtabs.scr{overflow-x:auto;scrollbar-width:none;margin:4px -18px 10px;padding:0 12px}.wtabs.scr::-webkit-scrollbar{display:none}
.wtabs button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px 10px;position:relative;color:var(--muted);font-size:.78rem;font-weight:600;min-height:62px}
.wtabs.scr button{flex:0 0 auto;min-width:68px;padding-inline:8px}
.wtabs .ic{position:relative;height:28px;display:flex;align-items:center;justify-content:center}
.wtabs .ic svg{width:1.6rem;height:1.6rem;stroke-width:1.5;opacity:.6}
.wtabs .ic i{position:absolute;top:-5px;right:-11px;font-style:normal;font-size:.62rem;font-weight:700;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--sunk);color:var(--muted);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}
.wtabs .tl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtabs button[aria-pressed="true"]{color:var(--fg)}
.wtabs button[aria-pressed="true"] .ic svg{opacity:1;stroke-width:1.9}
.wtabs button[aria-pressed="true"] .ic i{background:var(--fg);color:var(--surface)}
.wtabs button[aria-pressed="true"]::after{content:'';position:absolute;left:24%;right:24%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--fg)}
.rh{display:flex;align-items:center;gap:8px;margin:16px 4px 6px;font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}.rh .n{margin-left:auto;letter-spacing:0}
.lr{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 12px;position:relative;background:var(--surface)}
.lr+.lr::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--line)}
.lr .ck{width:44px;height:44px;margin:-4px -8px -4px -10px;display:flex;align-items:center;justify-content:center;flex:none;color:transparent}
.lr .ck span{width:26px;height:26px;border-radius:999px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.lr .ck[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lr .ti{flex:1;min-width:0;text-align:left;padding:6px 0;min-height:44px}
.lr .ti b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .ti small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .acil{font-size:.7rem;font-weight:800;color:var(--danger);background:var(--danger-soft);border-radius:999px;padding:2px 8px;flex:none}
.lr.done .ti b{text-decoration:line-through;color:var(--muted)}
.lin{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 6px 0 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--accent);color:var(--muted)}
.lin input{flex:1;min-width:0;border:0;background:none;font-size:1rem;color:var(--fg);outline:none;min-height:52px}
.lin .btn{min-height:42px;padding:0 14px}
.lhint{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.8rem;margin:8px 4px 2px}
/* İsteklerimiz: sade satırlar, satırda 1-5 isteme puanı çubuğu (Instagram kaydırıcısı gibi) */
.wr{display:grid;grid-template-columns:36px minmax(0,1fr) auto;column-gap:12px;row-gap:4px;align-items:center;padding:10px 14px;position:relative}
.wr+.wr::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--line)}
.wr .wi{grid-row:1/3;align-self:start;margin-top:2px;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.wr .wi svg{width:1.2rem;height:1.2rem}
.wr .tx{text-align:left;min-width:0}.wr .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .tx small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden}
.wr .tx small .pl{display:inline-flex;align-items:center;gap:3px;color:var(--accent-ink);font-weight:700}.wr .tx small svg{width:.85rem;height:.85rem}
.wr .tot{grid-row:1;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;font-size:.72rem;color:var(--muted);line-height:1.1}
.wr .tot b{font-family:var(--f-display);font-size:1.15rem;color:var(--fg)}
.screen.tsw{touch-action:pan-y}
.wtabs button.peek{color:var(--fg)}
.tsin-l{animation:tsinL .24s ease-out}.tsin-r{animation:tsinR .24s ease-out}
@keyframes tsinL{from{transform:translateX(-30%);opacity:0}}@keyframes tsinR{from{transform:translateX(30%);opacity:0}}
.tsedge{position:fixed;top:50%;z-index:30;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--fg);color:var(--surface);font-size:.82rem;font-weight:700;pointer-events:none;opacity:0;transition:opacity .12s;transform:translateY(-50%)}
.rbarw{grid-column:2/4;display:flex;align-items:center;gap:8px}
.rbar{flex:1;max-width:200px;display:flex;gap:3px;touch-action:none;cursor:pointer}
.rbar button{flex:1;height:34px;display:flex;align-items:center;padding:0}
.rbar button i{display:block;width:100%;height:10px;background:var(--sunk);border-radius:2px;transition:background .12s}
.rbar button:first-child i{border-radius:6px 2px 2px 6px}.rbar button:last-child i{border-radius:2px 6px 6px 2px}

const DOW=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const T=()=>iso(new Date());
const long=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]} ${DAYS[d.getDay()]}`};
const rel=s=>{const t=T();if(s===t)return 'Bugün';if(s===add(t,1))return 'Yarın';if(s===add(t,-1))return 'Dün';const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()].slice(0,3)} ${DOW[(d.getDay()+6)%7]}`};
const hm=t=>t?t.replace(':','.'):'';
const monday=s=>{const d=parse(s);return add(s,-((d.getDay()+6)%7))};
const ago=ts=>{const m=Math.round((Date.now()-ts)/60000);if(m<1)return 'az önce';if(m<60)return m+' dk önce';const h=Math.round(m/60);if(h<24&&iso(new Date(ts))===T())return h+' sa önce';const d=new Date(ts);if(iso(d)===add(T(),-1))return 'dün '+pad(d.getHours())+'.'+pad(d.getMinutes());return rel(iso(d))};
const clock=ts=>{const d=new Date(ts);return pad(d.getHours())+'.'+pad(d.getMinutes())};

const NL_W="a-zçğıöşü0-9",NL_B=`(?<![${NL_W}])`,NL_E=`(?![${NL_W}])`,NL_SX="(?:'?[a-zçğıöşü]*)";

function parseNL(raw){const T0=T(),o=[...(' '+raw+' ')],s=[...(' '+low(raw)+' ')],r={date:null,time:'',members:[],repeat:'none',loc:'',hit:{}};
 let L=s.join('');
 const cut=(re,fn)=>{const g=new RegExp(re,'g');let m;const rs=[];while((m=g.exec(L))){if(fn(m)!==false)rs.push([m.index,m.index+m[0].length]);if(!m[0].length)g.lastIndex++}
  rs.forEach(([a,b])=>{for(let i=a;i<b;i++){s[i]=' ';o[i]=' '}});L=s.join('');return rs.length};
 // tekrar
 cut(NL_B+'her gün'+NL_SX+NL_E,()=>{r.repeat='daily'});

 cut(NL_B+'(\\d{1,2}) gün sonra'+NL_E,m=>{r.date=add(T0,+m[1])});

 let part=null;

  cut(NL_B+'(sabah|öğleden sonra|öğlen|öğle|akşam|gece)'+NL_SX+NL_E,m=>{if(/(?:sı|si)$/.test(m[0])&&!/(?:bugün|yarın|bu|pazartesi|salı|çarşamba|perşembe|cuma|cumartesi|pazar)\s*$/.test(R0.slice(0,m.index)))return false;part=m[1]});

 return `<div class="ctop"><h1>Takvim</h1><div class="cvw" role="group" aria-label="Görünüm"><button data-act="calView" data-v="flow" aria-pressed="${k==='flow'}" aria-label="Akış">${I('listb')}</button><button data-act="calView" data-v="month" aria-pressed="${k==='month'}" aria-label="Ay">${I('cal')}</button></div><button class="add" data-act="tdAdd" aria-label="Ekle">${I('plus')}</button></div>
 <div class="cbar"><button class="cwho${f.length?' on':''}" data-act="calWho">${f.length?avs(f.slice(0,3)):famBadge()}<span>${esc(who)}</span>${I('chevD','sm')}</button>
 ${k==='flow'?`<button class="ctg" data-act="ctkAll" aria-pressed="${!!UI.ctk}">${UI.ctk?I('check','sm'):I('tasks','sm')}Görevler</button>`:''}</div>`}
function ctkLine(d,tks){if(!tks.length)return '';const t=T();
 if(UI.ctk||(UI.ctkOpen||{})[d])return tks.sort((a,b)=>tkKey(a,d)<tkKey(b,d)?-1:1).map(x=>crow('t',x,d)).join('')+(UI.ctk?'':`<button class="ctk" data-act="ctkDay" data-d="${d}"><span class="ck0">${I('chevU','sm')}</span><span class="b">Görevleri gizle</span></button>`);
 const who=[...new Set(tks.flatMap(x=>ws(x)))];
 return `<button class="ctk" data-act="ctkDay" data-d="${d}"><span class="ck0">${I('tasks','sm')}</span><span class="b">${tks.length} görev${tks.some(x=>x.due<t)?' · <em>geciken var</em>':''}</span>${avs(who.slice(0,3))}${I('chevR','sm')}</button>`}
function calFlow(c){const t=T();let h='',run=null;
 const flush=()=>{if(!run)return;h+=`<div class="dblock cemp" data-from="${run[0]}" data-to="${run[1]}">${run[0]===run[1]?shortD(run[0]):shortD(run[0])+' – '+shortD(run[1])} · boş</div>`;run=null};
 for(let i=0;i<UI.agN;i++){const d=add(UI.agStart,i),evs=evsOn(d,c),tks=tasksOn(d,c).filter(x=>!x.done);
  if(!evs.length&&!tks.length&&!hol(d)&&d!==t){run=run?[run[0],d]:[d,d];continue}flush();
  const dd=parse(d),nm=d===t?'Bugün':d===add(t,1)?'Yarın':d===add(t,-1)?'Dün':DAYS[dd.getDay()];
  const rows=evs.map(e=>crow('e',e,d,evPast(e,d))).join('')+ctkLine(d,tks);
  h+=`<section class="dblock cday${d===t?' today':''}" data-from="${d}" data-to="${d}" aria-label="${long(d)}"><div class="cdh"><b>${nm}</b><span>${dd.getDate()} ${MON[dd.getMonth()]}</span>${holChip(d)}<button class="cadd" data-act="addOn" data-d="${d}" aria-label="${long(d)} için ekle">${I('plus','sm')}</button></div><div class="cl">${rows||`<div class="tlempty" style="padding:14px">Plan yok 🌿</div>`}</div></section>`}
 flush();
 return strip(monday(UI.sel||t),UI.sel||t,{act:'goDay',head:true,ctx:c,mode:'week'})
  +(UI.agStart>add(t,-60)?`<button class="cprev" data-act="agPrev">${I('chevU','sm')}Önceki günler</button>`:'')+h+`<div id="cmore" class="cmore">Daha fazla gün yükleniyor…</div>`}
function calMonth(c){const d=UI.calDate,dd=parse(d),t=T(),f1=iso(new Date(dd.getFullYear(),dd.getMonth(),1)),last=iso(new Date(dd.getFullYear(),dd.getMonth()+1,0)),start=monday(f1);
 const sel=UI.cbSel&&UI.cbSel>=f1&&UI.cbSel<=last?UI.cbSel:(t>=f1&&t<=last?t:f1);let cells='';const wk=Math.ceil((daysBetween(start,last)+1)/7);
 for(let i=0;i<wk*7;i++){const x=add(start,i),cd=parse(x),out=cd.getMonth()!==dd.getMonth(),evs=out?[]:evsOn(x,c),tk=out?0:tasksOn(x,c).filter(y=>!y.done).length,h=out?null:hol(x);
  const bars=[...(h?[`<span class="mb hb ${h[1]}">${esc(holShort(h[0]))}</span>`]:[]),...evs.map(e=>`<span class="mb" style="--c:${evColor(e)}">${esc(e.title)}</span>`)];
  const more=bars.length>3?bars.length-2:0;
  cells+=`<button class="d${out?' out':''}${x===t?' today':''}${h&&h[1]==='resmi'?' rh':''}" aria-pressed="${x===sel}" data-act="cbDay" data-d="${x}" aria-label="${long(x)}${h?', '+h[0]:''}${evs.length?', '+evs.length+' etkinlik':''}${tk?', '+tk+' görev':''}"><span class="num">${cd.getDate()}</span>${(more?bars.slice(0,2):bars).join('')}${more?`<span class="mm">+${more}</span>`:''}${tk&&!more&&bars.length<3?`<span class="mt">✓${tk}</span>`:''}</button>`}
 const evs=evsOn(sel,c),tks=tasksOn(sel,c).filter(x=>!x.done),sd=parse(sel);
 return `<div class="calnav"><button class="icon-btn" data-act="calMove" data-n="-1" aria-label="Önceki ay">${I('chevL')}</button><div class="title" aria-live="polite">${MON[dd.getMonth()]} ${dd.getFullYear()}</div><button class="icon-btn" data-act="calMove" data-n="1" aria-label="Sonraki ay">${I('chevR')}</button><button class="btn ghost sm" data-act="cbToday">Bugün</button></div>
 <div class="mdet">${DOW.map(x=>`<div class="dow" aria-hidden="true">${x}</div>`).join('')}${cells}</div>
 <div class="cdh" style="margin-top:16px"><b>${sel===t?'Bugün':DAYS[sd.getDay()]}</b><span>${sd.getDate()} ${MON[sd.getMonth()]}</span>${holChip(sel)}<button class="cadd" data-act="addOn" data-d="${sel}" aria-label="${long(sel)} için ekle">${I('plus','sm')}</button></div>
 <div class="cl">${evs.map(e=>crow('e',e,sel,evPast(e,sel))).join('')+ctkLine(sel,tks)||`<div class="tlempty" style="padding:14px">Bu gün boş 🌿</div>`}</div>`}
function vCal(){const c={mine:false,filter:UI.filter};return calTop()+(UI.cal==='month'?calMonth(c):calFlow(c))}
function bindMore(){const m=document.getElementById('cmore');if(!m||!window.IntersectionObserver)return;const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();UI.agN+=14;render()}});io.observe(m)}

 if(v==='up'){const up=open.filter(x=>x.due>t),days=[...new Set(up.map(x=>x.due))];

function wselHTML(id){const x=M(id),t=T(),c={mine:false,filter:[id]},dd=parse(t),mon=MON[dd.getMonth()];

  if(evs.length||tks.length)days.push([d,{evs,tks}])}
 const n=days.reduce((a,[,v])=>a+v.evs.length+v.tks.length,0);
 return `<div class="sec-h"><h2 class="sec">${esc(gen(first(x.name)))} ${mon} programı${n?` <span class="qty">· ${n}</span>`:''}</h2><button class="link" data-act="openMember" data-id="${id}">Profil ${I('chevR','sm')}</button></div>

function bindWheel(){const w=document.getElementById('wheel');if(!w)return;const cs=[...w.children],n=cs.length/3,flat=calm();
 const center=el=>el.offsetLeft+el.offsetWidth/2-w.clientWidth/2;
 const paint=()=>{const mid=w.scrollLeft+w.clientWidth/2;cs.forEach(c=>{const d=(c.offsetLeft+c.offsetWidth/2-mid)/c.offsetWidth,a=Math.min(Math.abs(d),2);
  c.style.transform=flat?`scale(${1-a*.1})`:`perspective(700px) rotateY(${-d*32}deg) scale(${1-a*.14})`;c.style.opacity=String(1-a*.35);c.classList.toggle('mid',a<.5)})};
 const nearest=()=>{const mid=w.scrollLeft+w.clientWidth/2;return cs.reduce((b,c)=>Math.abs(c.offsetLeft+c.offsetWidth/2-mid)<Math.abs(b.offsetLeft+b.offsetWidth/2-mid)?c:b)};
 w.scrollLeft=center(cs.find(c=>c.dataset.c==='1'&&c.dataset.id===UI.wsel)||cs[n]);paint();
 let raf=0,to;const settle=()=>{clearTimeout(to);
  let c=nearest();const ci=+c.dataset.c;if(ci!==1){const tw=cs[cs.indexOf(c)+(ci===0?n:-n)];w.scrollLeft+=center(tw)-center(c);c=tw;paint()}
  if(UI.wsel!==c.dataset.id){UI.wsel=c.dataset.id;const s=document.getElementById('wsel');if(s)s.innerHTML=wselHTML(c.dataset.id);
   const ids=cs.slice(0,n).map(x=>x.dataset.id);document.querySelectorAll('.wdots i').forEach((d,i)=>d.classList.toggle('on',ids[i]===c.dataset.id))}};
 w.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;paint()});clearTimeout(to);to=setTimeout(settle,150)},{passive:true});w.addEventListener('scrollend',settle)}

function sheet(title,body){lastFocus=document.activeElement;
 document.getElementById('layer').innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grip" aria-hidden="true"></div><div class="sh"><h3 id="sh-t">${title}</h3><button class="icon-btn" data-act="close" aria-label="Kapat">${I('x')}</button></div><div class="sb">${body}</div></div>`;
 setTimeout(()=>{const f=document.querySelector('.sheet [autofocus]')||document.querySelector('.sheet .icon-btn');f&&f.focus()},60);dragSheet();const t=document.querySelector('.toast');t&&t.classList.add('top')}
function close(){document.getElementById('layer').innerHTML='';UI.joinFor=null;const t=document.querySelector('.toast');t&&t.classList.remove('top');lastFocus&&document.body.contains(lastFocus)&&lastFocus.focus()}
function dragSheet(){const sh=document.querySelector('.sheet');if(!sh)return;let y0=null,dy=0,t0=0;
 const scrim=()=>document.querySelector('.scrim');
 const start=e=>{if(e.target.closest('button'))return;y0=e.clientY;dy=0;t0=Date.now();sh.style.animation='none';sh.style.transition='none';e.currentTarget.setPointerCapture(e.pointerId)};
 const move=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`;const s=scrim();if(s)s.style.opacity=String(1-Math.min(dy/sh.offsetHeight,1)*.8)};
 const end=()=>{if(y0==null)return;y0=null;const fast=dy>40&&dy/(Date.now()-t0)>.6;sh.style.transition='transform .2s ease';
  if(dy>110||fast){sh.style.transform='translateY(100%)';setTimeout(close,190)}else{sh.style.transform='';const s=scrim();if(s){s.style.transition='opacity .2s';s.style.opacity=''}}};
 sh.querySelectorAll('.grip,.sh').forEach(h=>{h.style.touchAction='none';h.addEventListener('pointerdown',start);h.addEventListener('pointermove',move);h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)})}
let tt;
function toast(msg,undo,label){const w=document.getElementById('toastwrap');clearTimeout(tt);
 w.innerHTML=`<div class="toast${document.querySelector('.sheet')?' top':''}"><span class="msg">${esc(msg)}</span>${undo?`<button data-act="undo">${label||'Geri al'}</button>`:''}</div>`;
 if(undo&&undo.before&&!undo.after)undo.after=clone(flat(S));
 toast.undo=undo;tt=setTimeout(()=>{w.innerHTML='';toast.undo=null},undo?6000:3000)}
// Geri al: yalnızca bu işlemin değiştirdiği kayıtları eski hâline döndürür, arada başkalarının yaptıklarına dokunmaz.
const snap=()=>{const before=clone(flat(S));const f=()=>{if(!S)return;const cur=flat(S),after=f.after||{};
 for(const p of new Set([...Object.keys(before),...Object.keys(after)])){if(canon(before[p])===canon(after[p]))continue;if(before[p]===undefined)delete cur[p];else cur[p]=clone(before[p])}
 setS(unflat(clone(cur)));render(true);toast('Geri alındı')};f.before=before;return f};

// Sık alınanlar: listede bekleyenler hariç, yazdıkça süzülür. Önce genel market ürünleri, sonra ailenin daha önce aldıkları.
// Alışveriş hafızası (freq): her eklenen ürün sayılır; öneriler en çok eklenenlerden gelir.
// Hafıza boşken (yeni aile) genel market ürünleri gösterilir.
const COMMON=['Süt','Ekmek','Yumurta','Peynir','Domates','Zeytin','Çay','Deterjan'];
const fid=n=>{let h=5381;const k=low(n.trim());for(let i=0;i<k.length;i++)h=(h*33^k.charCodeAt(i))>>>0;return 'f'+h.toString(36)+k.length};
// İki ekleme arası gün ortalaması da tutulur (ileride "zamanı gelenler" için).
function remember(nm){S.freq=S.freq||[];const id=fid(nm),f=S.freq.find(x=>x.id===id),now=Date.now();
 if(!f){S.freq.push({id,name:nm,n:1,every:0,last:now});return}
 const gap=(now-f.last)/864e5;f.n++;if(gap>.5)f.every=f.every?Math.round((f.every*.7+gap*.3)*10)/10:Math.round(gap*10)/10;f.last=now;f.name=nm}
function suggHTML(q){const L=UI.list,have=new Set(S.items.filter(i=>i.list===L&&!i.done).map(i=>low(i.name)));q=low(q.trim());
 const fr=(S.freq||[]).filter(f=>f.n>=2);
 const pool=(fr.length?[...fr].sort((a,b)=>b.n-a.n).map(f=>f.name):COMMON).filter(n=>!have.has(low(n))&&(!q||low(n).includes(q))&&low(n)!==q).slice(0,8);
 return pool.length?`<small>${q?'Öneriler':fr.length?'En çok eklediklerin':'Sık alınanlar'}</small>${pool.map(n=>`<button type="button" data-act="sugAdd" data-v="${esc(n)}">${I('plus','sm')}${esc(n)}</button>`).join('')}`:''}
// Alışveriş modu: seçilen mağaza türündeki (kategori) ürünler bütün listelerden tek ekranda; market için reyonlara göre
const REYON=[['Temizlik & kağıt',['deterjan','tuvalet kağıdı','peçete','sabun','çamaşır suyu','bulaşık']],['Meyve & sebze',['domates','salatalık','patates','soğan','muz','elma','limon','meyve','sebze','biber','marul']],['Süt & kahvaltılık',['süt','peynir','yumurta','zeytin','yoğurt','tereyağ','bal','reçel']],['Et & tavuk',['et','tavuk','kıyma','balık','sucuk']],['Fırın & temel gıda',['ekmek','makarna','pirinç','bulgur','mercimek','şeker','salça','çay','kahve','kurabiye','un']]];
function reyonOf(name){const n=low(name),w=n.split(/\s+/);for(const [r,ks] of REYON)if(ks.some(k=>k.includes(' ')?n.includes(k):w.some(x=>x.startsWith(k))))return r;return 'Diğer'}
const catsOf=arr=>{const c={};arr.forEach(i=>c[i.cat]=(c[i.cat]||0)+1);return Object.entries(c).sort((a,b)=>(a[0]==='Market'?-1:b[0]==='Market'?1:b[1]-a[1]))};
function vShop(){const cat=UI.shop,all=S.items.filter(i=>i.cat===cat);const pend=all.filter(i=>!i.done),inCart=all.filter(i=>i.done&&(i.doneAt||0)>=UI.shopAt);
 const lname=id=>(S.lists.find(l=>l.id===id)||{}).name||'';
 const row=i=>`<div class="row item shop${i.done?' done':''}" data-sw="item" data-id="${i.id}"><button class="chk" data-act="toggleItem" data-id="${i.id}" aria-pressed="${i.done}" aria-label="${esc(i.name)}: ${i.done?'sepetten çıkar':'sepete koydum'}"><span>${I('check','sm')}</span></button>
  <button class="body tap" style="text-align:left" data-act="openItem" data-id="${i.id}"><span class="t">${esc(i.name)}</span><span class="m">${i.note?`<span style="color:var(--fg)">${esc(i.note)}</span>`:''}${S.lists.length>1?`<span>${esc(lname(i.list))}</span>`:''}${i.for&&i.for!=='ev'?`<span class="who">${av(i.for,'xs')}${esc(first(M(i.for).name))}</span>`:''}</span></button></div>`;
 const groups={};pend.forEach(i=>{const g=cat==='Market'?reyonOf(i.name):lname(i.list);(groups[g]=groups[g]||[]).push(i)});
 const order=cat==='Market'?[...REYON.map(r=>r[0]),'Diğer']:Object.keys(groups);
 const stores=catsOf(S.items.filter(i=>!i.done));
 return `<div class="hdr"><div class="h"><h1>${cat==='Market'?'Marketteyim':esc(cat)}</h1><div class="sub">Bütün listelerden ${pend.length} ürün bekliyor</div></div><button class="btn primary sm" data-act="shopEnd">Bitir</button></div>
 <div class="chips" role="group" aria-label="Neredesin?">${stores.map(([c,n])=>`<button class="chip plain" data-act="shopCat" data-v="${esc(c)}" aria-pressed="${c===cat}">${esc(c)} <span class="n">${n}</span></button>`).join('')}</div>
 ${pend.length?order.filter(g=>groups[g]).map(g=>`<div class="catlbl">${esc(g)} · ${groups[g].length}</div><div class="group">${groups[g].map(row).join('')}</div>`).join(''):`<div class="group" style="margin-top:14px">${emptyBox('Hepsi sepette 🎉','Bu alışverişte alınacak başka bir şey kalmadı.')}</div>`}
 ${inCart.length?`<div class="catlbl">Sepette · ${inCart.length}</div><div class="group">${inCart.map(row).join('')}</div>`:''}`}
// Bu hafta tamamlanan görev sayısı = yıldız (çocuk hesaplarında görünür)
const weekStars=()=>{const from=parse(monday(T())).getTime();return S.tasks.filter(x=>x.done&&x.doneBy===meId()&&(x.doneAt||0)>=from).length};
const starsHTML=()=>{const n=weekStars();return `<div class="stars">⭐ ${n?`Bu hafta ${n} yıldız`:'Bu hafta ilk yıldızını kazan: bir görevini bitir'}</div>`};
function confetti(x,y){if(calm())return;const ph=document.getElementById('phone'),pr=ph.getBoundingClientRect(),cs=S.members.map(m=>m.color);
 for(let i=0;i<22;i++){const p=document.createElement('i');p.className='cf';p.style.left=(x-pr.left)+'px';p.style.top=(y-pr.top)+'px';p.style.background=cs[i%cs.length];ph.appendChild(p);
  const a=-Math.PI/2+(Math.random()-.5)*2.2,v=70+Math.random()*90,dx=Math.cos(a)*v,dy=Math.sin(a)*v;
