<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bizim Ev">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bizim Ev</title>
<meta name="description" content="Ailenin takvimi, görevleri ve listeleri tek yerde.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Telefonda tam ekran uygulama, altta 5 sekmeli menü; geniş ekranda ortada telefon genişliğinde bir çerçeve */
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --sunk:#F2EEE8; --line:#E4DED4; --fg:#22201D; --muted:#625B52;
  --accent:#2E6A51; --on-accent:#FFFFFF; --accent-soft:#E1EDE6; --accent-ink:#22533F;
  --coral:#B9502F; --coral-soft:#FBE9E2; --danger:#B3261E; --danger-soft:#FBE4E2; --warn:#7D5200; --warn-soft:#FFF0D2;
  --stage:#ECE7DF; --scrim:rgba(30,24,18,.38);
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16140F; --surface:#211E19; --sunk:#2B2721; --line:#3B362E; --fg:#F2EDE5; --muted:#ADA497;
  --accent:#8BCBA9; --on-accent:#0D2419; --accent-soft:#1F342A; --accent-ink:#A5DABD;
  --coral:#F29A80; --coral-soft:#3A251E; --danger:#F3A69F; --danger-soft:#3E201D; --warn:#F2C46E; --warn-soft:#3A2E15;
  --stage:#0D0C0A; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16140F; --surface:#211E19; --sunk:#2B2721; --line:#3B362E; --fg:#F2EDE5; --muted:#ADA497;
  --accent:#8BCBA9; --on-accent:#0D2419; --accent-soft:#1F342A; --accent-ink:#A5DABD;
  --coral:#F29A80; --coral-soft:#3A251E; --danger:#F3A69F; --danger-soft:#3E201D; --warn:#F2C46E; --warn-soft:#3A2E15;
  --stage:#0D0C0A; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}
html.big{font-size:125%}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--stage);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:1.375rem;height:1.375rem;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:1.05rem;height:1.05rem}

.stage{height:100%;display:flex;justify-content:center;align-items:center}
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px){.phone{width:400px;height:min(860px,calc(100% - 48px));border-radius:36px;box-shadow:var(--shadow),0 0 0 10px var(--surface),0 0 0 11px var(--line)}}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 110px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.hdr .h{min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px;font-size:.95rem}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:1.125rem;margin:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:26px 0 8px}
.link{color:var(--accent-ink);font-weight:600;font-size:.95rem;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:4px}
:root[data-theme="dark"] .link{color:var(--accent)}

.btn{min-height:48px;padding:0 18px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:.95rem}
.icon-btn{width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk)}
[aria-disabled="true"]{opacity:.45}

.av{--c:#888;width:2rem;height:2rem;border-radius:999px;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex:none}
.av.lg{width:3.25rem;height:3.25rem;font-size:1.25rem}
.av.xs{width:1.5rem;height:1.5rem;font-size:.7rem}
.avs{display:flex;flex:none}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-left:-8px}
.who{display:inline-flex;align-items:center;gap:6px}

/* Bugün */
.ann{background:var(--coral-soft);border-radius:var(--r-lg);padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.ann .ic{color:var(--coral);margin-top:2px}
.ann .txt{font-size:1.125rem;font-weight:600;line-height:1.35}
.ann .meta{color:var(--muted);font-size:.875rem;margin-top:6px}
.ann .body{flex:1;min-width:0}
.ann-empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--muted);width:100%;text-align:left;min-height:56px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.9rem;padding:8px 4px;text-align:center}
.qa button .ic{width:2.25rem;height:2.25rem;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}

.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;text-align:left;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;display:block;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.875rem;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;align-items:center}
.row .m span{display:inline-flex;align-items:center;gap:4px}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--sunk)}
.time{font-variant-numeric:tabular-nums;font-weight:700;width:3.4rem;flex:none;font-size:.95rem}
.time.ad{font-size:.78rem;font-weight:600;color:var(--muted);line-height:1.15}
.mbar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:4px}
.empty .btn{margin-top:12px}

.chk{width:48px;height:48px;margin:-6px -6px -6px -8px;display:flex;align-items:center;justify-content:center;flex:none}
.chk span{width:1.75rem;height:1.75rem;border-radius:999px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s}
.chk[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.rot{background:var(--accent-soft);color:var(--accent-ink)}
.tag.cat{background:var(--sunk);color:var(--fg);font-weight:600}
.tag.soon{background:var(--warn-soft);color:var(--warn)}
.tag.later{background:var(--sunk);color:var(--muted)}
.want{min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;flex:none;background:var(--surface)}
.want[aria-pressed="true"]{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.want svg{width:1.1rem;height:1.1rem}
.want[aria-pressed="true"] svg{fill:currentColor}
.wic{width:40px;height:40px;border-radius:12px;background:var(--sunk);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);font-size:1.6rem;background:var(--surface)}
.moods button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.idea{background:var(--accent-soft);border-radius:var(--r-lg);padding:14px 16px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.idea .t{font-weight:700;display:block}
.idea .m{color:var(--muted);font-size:.875rem}

/* Segmented + chips */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--muted);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 14px 0 8px;border-radius:999px;border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;background:var(--surface);flex:none}
.chip.plain{padding:0 16px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chip .n{font-size:.8rem;background:var(--sunk);border-radius:999px;padding:1px 7px;color:var(--fg)}
.chip .ord{font-size:.75rem;background:var(--accent);color:var(--on-accent);border-radius:999px;width:1.25rem;height:1.25rem;display:inline-flex;align-items:center;justify-content:center}

/* Takvim */
.calnav{display:flex;align-items:center;gap:4px;margin:14px 0 6px}
.calnav .title{flex:1;font-family:var(--f-display);font-weight:600;font-size:1.15rem;text-align:center}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--surface);border-radius:var(--r-lg);padding:8px;box-shadow:var(--shadow)}
.month .dow{font-size:.75rem;color:var(--muted);text-align:center;padding:4px 0;font-weight:600;letter-spacing:.03em}
.month .d{min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-variant-numeric:tabular-nums;font-weight:600}
.month .d.out{color:var(--muted);opacity:.55}
.month .d.today .num{background:var(--coral);color:#fff;border-radius:999px;width:1.75rem;height:1.75rem;display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .month .d.today .num{color:#2A140C}
.month .d[aria-pressed="true"]{background:var(--accent-soft)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--c)}
.daylbl{font-weight:700;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.daylbl small{color:var(--muted);font-weight:500;font-size:.85rem}

/* Listeler */
.addbar{display:flex;gap:8px;margin:12px 0 4px}
.addbar input{flex:1;min-width:0;min-height:52px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 18px;font-size:1.05rem}
.addbar input:focus{border-color:var(--accent);outline:none}
.catlbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 4px 6px}
.item{min-height:58px}
.qty{color:var(--muted);font-weight:500}
.donebar{display:flex;align-items:center;justify-content:space-between;margin-top:22px}

/* Aile */
.code{font-family:var(--f-display);font-size:2rem;font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.invite{background:var(--accent-soft);border-radius:var(--r-lg);padding:18px}
.invite .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.feed .row{min-height:52px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:60px}
.setrow+.setrow{border-top:1px solid var(--line)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* Alt menü */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);border-radius:16px}
.nav button .pill{width:3.5rem;height:2rem;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent-ink)}

/* Sheet, toast */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:26px 26px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 20px;gap:8px}
.sheet .sh h3{font-family:var(--f-display);font-size:1.3rem;margin:0}
.sheet .sb{overflow-y:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.flabel{font-weight:600;font-size:.9rem}
.inp{min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:10px 14px;font-size:1rem;width:100%}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
details.more{border-top:1px solid var(--line);margin:4px 0 14px}
details.more summary{min-height:52px;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--accent-ink);cursor:pointer;list-style:none}
:root[data-theme="dark"] details.more summary{color:var(--accent)}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary svg{transform:rotate(180deg)}
.note{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin:-4px 0 12px}
.err{color:var(--danger);font-size:.875rem;font-weight:600}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1}
.dl{display:grid;gap:12px;margin:8px 0 18px}
.dl div{display:flex;gap:12px;align-items:flex-start}
.dl svg{color:var(--muted);margin-top:1px}
.toast{position:absolute;left:14px;right:14px;bottom:92px;z-index:30;background:var(--fg);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;min-height:52px;box-shadow:var(--shadow);animation:up2 .2s}
.toast .msg{flex:1;font-weight:500}
.toast button{color:var(--bg);font-weight:700;min-height:44px;padding:0 12px;border-radius:12px;text-decoration:underline;text-underline-offset:3px}
@keyframes up2{from{transform:translateY(20px);opacity:0}}
.dgroup{margin-bottom:18px}
.dgroup .flabel{display:block;margin-bottom:8px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.people{display:grid;gap:6px}
.people button{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:14px;text-align:left;border:1.5px solid transparent}
.people button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.people small{display:block;color:var(--muted);font-size:.8rem}

/* Yükleniyor / hata */
.sk{background:var(--sunk);border-radius:14px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
:root[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@keyframes sh{to{transform:translateX(100%)}}
.state-err{text-align:center;padding:60px 12px}
.state-err .ic{width:64px;height:64px;border-radius:999px;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.child-hint{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-md);padding:10px 14px;font-weight:600;font-size:.9rem;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:32px;padding-block:24px 40px}
.welcome .logo{width:76px;height:76px;border-radius:22px;display:block;box-shadow:var(--shadow)}
.welcome h1{font-size:2.4rem;margin-top:18px}
.welcome .lead{color:var(--muted);font-size:1.1rem;max-width:30ch;margin:8px 0 0}
.welcome .acts{display:grid;gap:10px}
.welcome .acts .btn{min-height:56px;font-size:1.05rem}
.netbar{position:absolute;top:0;left:0;right:0;z-index:8;background:var(--warn-soft);color:var(--warn);font-size:.85rem;font-weight:600;padding:calc(6px + env(safe-area-inset-top,0px)) 16px 6px;text-align:center}
.phone.off .screen{padding-top:calc(48px + env(safe-area-inset-top,0px))}
.demobar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:var(--r-md);padding:6px 6px 6px 14px;font-size:.9rem;font-weight:600;margin-bottom:14px}
.codebox .inp{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.15em;text-transform:uppercase;text-align:center}
.btn[disabled]{opacity:.6;cursor:progress}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <div class="netbar" id="netbar" role="status" hidden></div>
    <main class="screen" id="screen" tabindex="-1"></main>
    <nav class="nav" id="nav" aria-label="Ana menü"></nav>

/* ---------- Senkron: yerel durum <-> Firebase ----------
   Firebase'de her aile families/{kod} altında durur: meta, ann ve her koleksiyon {id: kayıt} olarak.
   Ekranda kullanılan S ise diziler tutar. Her render sonunda commit() S'yi son bilinen hâliyle
   (baseC) karşılaştırır, değişen kayıtları "pending" kuyruğuna koyar ve tek PATCH ile gönderir.
   Diğer cihazlardaki değişiklikler EventSource akışıyla gelir (store.R), S yeniden kurulur. */
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function canon(o){if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return '['+o.map(canon).join(',')+']';return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}'}
const okId=k=>/^[A-Za-z0-9_-]{1,40}$/.test(k);
const okDate=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v);
const okTime=v=>typeof v==='string'&&/^\d\d:\d\d$/.test(v);
const str=v=>typeof v==='string'?v:'';
const idList=v=>(Array.isArray(v)?v:v&&typeof v==='object'?Object.values(v):[]).filter(x=>typeof x==='string'&&okId(x));
function norm(c,id,x){x=Object.assign({},x&&typeof x==='object'?x:{},{id});
 switch(c){
  case 'members':x.name=str(x.name)||'?';x.rel=str(x.rel);if(!ROLES[x.role])x.role='adult';if(!/^#[0-9a-fA-F]{6}$/.test(x.color||''))x.color='#8A8178';break;
  case 'events':x.title=str(x.title);if(!okDate(x.date))x.date=T();x.time=okTime(x.time)?x.time:'';x.members=idList(x.members);if(!CATS[x.cat])x.cat='aile';if(!REM[x.rem])x.rem='none';if(!REP[x.repeat])x.repeat='none';x.loc=str(x.loc);x.desc=str(x.desc);break;
  case 'tasks':x.title=str(x.title);if(!okDate(x.due))x.due=T();x.time=okTime(x.time)?x.time:'';x.rot=idList(x.rot);if(!TREP[x.repeat])x.repeat='none';x.done=!!x.done;break;
  case 'lists':x.name=str(x.name)||'Liste';if(!P[x.icon])x.icon='tag';break;
  case 'items':x.name=str(x.name)||'?';x.note=str(x.note);x.cat=str(x.cat)||'Diğer';if(!PRI[x.pri])x.pri='yakinda';x.for=str(x.for);x.list=str(x.list);x.done=!!x.done;break;
  case 'wishes':x.title=str(x.title)||'?';x.note=str(x.note);if(!WT[x.type])x.type='yer';x.want=idList(x.want);x.doneWith=idList(x.doneWith);if(!MOODS.includes(x.mood))x.mood='';x.planned=okDate(x.planned)?x.planned:'';x.done=!!x.done;break;
  case 'activity':x.text=str(x.text);x.at=+x.at||0;break}
 return x}
function flat(s){const o={};if(!s)return o;for(const c of COLS)for(const x of s[c]||[])o[c+'/'+x.id]=x;if(s.ann)o.ann=s.ann;if(s.meta)o.meta=s.meta;return o}
function unflat(o){const s={meta:o.meta||{},ann:o.ann&&typeof o.ann==='object'?Object.assign({},o.ann,{text:str(o.ann.text)}):null};for(const c of COLS)s[c]=[];
 for(const p in o){const i=p.indexOf('/');if(i<0)continue;const c=p.slice(0,i);if(s[c])s[c].push(norm(c,p.slice(i+1),o[p]))}
 s.members.sort((a,b)=>(a.at||0)-(b.at||0));s.lists.sort((a,b)=>(a.at||0)-(b.at||0));s.activity.sort((a,b)=>b.at-a.at);return s}
function flatR(R){const o={};if(!R)return o;for(const c of COLS){const col=R[c];if(!col||typeof col!=='object')continue;for(const id in col)if(okId(id)&&col[id]!=null)o[c+'/'+id]=col[id]}if(R.ann)o.ann=R.ann;if(R.meta)o.meta=R.meta;return o}
function rebase(){baseC={};const f=flat(S);for(const p in f)baseC[p]=canon(f[p])}
function fromRemote(){const o=flatR(store.R);for(const p in store.pending){if(store.pending[p]===null)delete o[p];else o[p]=store.pending[p]}S=unflat(clone(o));rebase()}
function setS(v){S=v;if(store.mode==='demo')store.demo=S}
function setAt(root,path,val){const ks=path.split('/').filter(Boolean);if(!ks.length)return val&&typeof val==='object'?val:{};root=root&&typeof root==='object'?root:{};let o=root;
 for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object'){if(val===null)return root;o[ks[i]]={}}o=o[ks[i]]}
 if(val===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=val;return root}
const fbUrl=(code,p)=>`${FB_URL}/families/${code}${p||''}.json`;
async function fbGet(code,p){const r=await fetch(fbUrl(code,p));if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function fbSend(code,method,body,p){const r=await fetch(fbUrl(code,p),{method,body:JSON.stringify(body)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

function commit(){
 if(store.mode==='demo'){if(S)store.demo=S;save();return}
 if(store.mode!=='family'||!S){save();return}
 const cur=flat(S);let n=0;
 for(const p in cur){const c=canon(cur[p]);if(c!==baseC[p]){store.pending[p]=clone(cur[p]);baseC[p]=c;n++}}
 for(const p in baseC)if(!(p in cur)){store.pending[p]=null;delete baseC[p];n++}
 save();if(n)flush()}
let flushing=false,retryT=null,retryMs=3000;
async function flush(){
 if(flushing||store.mode!=='family')return;const body=clone(store.pending);if(!Object.keys(body).length){renderNet();return}
 flushing=true;let ok=false;const code=store.code;
 try{await fbSend(code,'PATCH',body);ok=true;
  if(store.code!==code)return;
  for(const p in body){store.R=setAt(store.R,p,body[p]);if(canon(store.pending[p])===canon(body[p]))delete store.pending[p]}
  retryMs=3000;save();setNet('online')}
 catch(e){setNet('offline');clearTimeout(retryT);retryT=setTimeout(flush,retryMs);retryMs=Math.min(retryMs*2,60000)}
 finally{flushing=false;if(ok&&Object.keys(store.pending).length)flush()}}
let es=null,rq=0;
function connect(){
 if(es){es.close();es=null}
 if(store.mode!=='family'||!FB_URL||typeof EventSource==='undefined')return;
 es=new EventSource(fbUrl(store.code));
 es.addEventListener('put',e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}store.R=m.path==='/'?(m.data&&typeof m.data==='object'?m.data:{}):setAt(store.R,m.path,m.data);remote()});
 es.addEventListener('patch',e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}for(const k in m.data||{})store.R=setAt(store.R,m.path+'/'+k,m.data[k]);remote()});
 es.addEventListener('cancel',()=>{UI.err='denied';render()});
 es.onopen=()=>{setNet('online');flush()};
 es.onerror=()=>setNet(navigator.onLine?'reconnecting':'offline');
}
function remote(){setNet('online');clearTimeout(rq);rq=setTimeout(()=>{
 if(!store.R||!store.R.meta){UI.err='missing';render();return}
 UI.err=null;fromRemote();save();render(true);checkReminders()},40)}
let netT=null;
function setNet(v){UI.net=v;clearTimeout(netT);if(v==='online')renderNet();else netT=setTimeout(renderNet,1500)}
function renderNet(){const b=document.getElementById('netbar');if(!b)return;const n=Object.keys(store.pending||{}).length;
 const ph=document.getElementById('phone');if(store.mode!=='family'||UI.net==='online'){b.hidden=true;ph.classList.remove('off');return}ph.classList.add('off');
 b.hidden=false;b.textContent=UI.net==='offline'?(n?'Çevrimdışısın. Değişikliklerin bağlantı gelince gönderilecek.':'Çevrimdışısın. Bağlantı gelince güncellenecek.'):'Bağlanıyor…'}

function can(a,o){const m=me(),r=m.role;
 switch(a){
  case 'event.edit':return r!=='child'||(o.by===m.id&&o.members.length===1&&o.members[0]===m.id);
  case 'task.assign':return r!=='child';
  case 'task.complete':return r!=='child'||o.assignee===m.id;
  case 'task.edit':return r!=='child'||(o.by===m.id&&o.assignee===m.id);
  case 'list.manage':return r!=='child';
  case 'announce':return r!=='child';
  case 'member.manage':return r==='admin';
 }return true}
const lock=(ok,msg)=>ok?'':` data-lock="${esc(msg)}" aria-disabled="true"`;

/* Olay tekrarları */
function occurs(e,day){if(day<e.date)return false;if(day===e.date)return true;const a=parse(e.date),b=parse(day);
 switch(e.repeat){case 'daily':return true;case 'weekly':return a.getDay()===b.getDay();case 'monthly':return a.getDate()===b.getDate();case 'yearly':return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()}return false}
const sortEv=(a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00');
function eventsOn(day,onlyMine){return S.events.filter(e=>occurs(e,day)&&(UI.filter.length===0||e.members.some(x=>UI.filter.includes(x)))&&(!onlyMine||e.members.includes(meId()))).sort(sortEv)}
const nextDue=(due,rep)=>{const d=parse(due);if(rep==='daily')d.setDate(d.getDate()+1);else if(rep==='weekly')d.setDate(d.getDate()+7);else if(rep==='monthly')d.setMonth(d.getMonth()+1);return iso(d)};
const nextIn=t=>t.rot&&t.rot.length>1?t.rot[(t.rot.indexOf(t.assignee)+1)%t.rot.length]:null;
const annVisible=()=>S.ann&&(!S.ann.until||Date.now()<S.ann.until);

let tt;
function toast(msg,undo,label){const w=document.getElementById('toastwrap');clearTimeout(tt);
 w.innerHTML=`<div class="toast"><span class="msg">${esc(msg)}</span>${undo?`<button data-act="undo">${label||'Geri al'}</button>`:''}</div>`;
 if(undo&&undo.before&&!undo.after)undo.after=clone(flat(S));
 toast.undo=undo;tt=setTimeout(()=>{w.innerHTML='';toast.undo=null},undo?6000:3000)}
// Geri al: yalnızca bu işlemin değiştirdiği kayıtları eski hâline döndürür, arada başkalarının yaptıklarına dokunmaz.
const snap=()=>{const before=clone(flat(S));const f=()=>{if(!S)return;const cur=flat(S),after=f.after||{};
 for(const p of new Set([...Object.keys(before),...Object.keys(after)])){if(canon(before[p])===canon(after[p]))continue;if(before[p]===undefined)delete cur[p];else cur[p]=clone(before[p])}
 setS(unflat(clone(cur)));render(true);toast('Geri alındı')};f.before=before;return f};

/* ---------- Yardımcılar: katılım, kopyalama, hatırlatma ---------- */
function busy(btn,label){if(!btn)return;if(label){btn.dataset.t=btn.textContent;btn.textContent=label;btn.disabled=true}else{btn.textContent=btn.dataset.t||btn.textContent;btn.disabled=false}}
function joinWho(){const j=F.join;
 sheet(esc(j.meta.name||'Aile'),`<p style="margin:0 0 12px">Hoş geldin! Listede sen hangisisin?</p><div class="people">${j.members.map(m=>`<button data-act="joinAs" data-id="${m.id}"><span class="av" style="--c:${m.color}" aria-hidden="true">${esc(up(m.name[0]))}</span><span><b>${esc(m.name)}</b><small>${ROLES[m.role]}${m.rel?' · '+esc(m.rel):''}</small></span></button>`).join('')}</div>
 <button class="btn soft block" style="margin-top:12px" data-act="joinNewSheet">${I('plus','sm')}Listede yokum, beni ekle</button>`)}
function enterFamily(code,id){Object.assign(store,{mode:'family',code,me:id,R:null,pending:{}});S=null;UI.err=null;UI.tab='today';close();save();render();connect()}
function copyText(t,msg){const fallback=()=>{const el=document.getElementById('fam-code');if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Kopyalanamadı, kodu elle seçebilirsin')};
 try{navigator.clipboard.writeText(t).then(()=>toast(msg),fallback)}catch(e){fallback()}}
let swReg=null,installEvt=null;
const REM_MS={m15:15*60e3,h1:3600e3,d1:864e5};
function askNotify(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>{if(UI.tab==='family')render(true)})}catch(e){}}
function notify(title,body){try{if('Notification' in window&&Notification.permission==='granted'){if(swReg&&swReg.showNotification){swReg.showNotification(title,{body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:title});return}new Notification(title,{body,icon:'icons/icon-192.png'});return}}catch(e){}toast(`Hatırlatma: ${title}, ${body}`)}
// Uygulama açıkken etkinlik hatırlatmalarını gösterir. Gerçek push için sunucu gerekir; o sonraki adım.
function checkReminders(){if(!S||!store.mode)return;const now=Date.now(),mine=meId(),t=T();store.fired=store.fired||{};
 for(const day of [t,add(t,1)])for(const e of S.events){if(!REM_MS[e.rem]||!e.members.includes(mine)||!occurs(e,day))continue;const k=e.id+'|'+day;if(store.fired[k])continue;
  const st=parse(day);if(e.time){const[h,mi]=e.time.split(':');st.setHours(+h,+mi,0,0)}else st.setHours(9,0,0,0);const at=st.getTime()-REM_MS[e.rem];
  if(now>=at&&now-at<30*60e3&&now<st.getTime()+3600e3){store.fired[k]=1;notify(e.title,`${rel(day)}${e.time?' '+hm(e.time):', tüm gün'}${e.loc?' · '+e.loc:''}`)}}
 for(const k in store.fired)if(k.split('|')[1]<add(t,-2))delete store.fired[k];save()}

/* ---------- Olay dinleyicileri ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
 if(el.dataset.lock){e.preventDefault();toast(el.dataset.lock);return}
 const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el,e)}});
document.addEventListener('submit',e=>{const f=e.target.dataset.form;if(f&&FORMS[f]){e.preventDefault();FORMS[f]()}});
document.addEventListener('change',e=>{
 if(e.target.id==='ev-allday'){const t=document.getElementById('ev-time');t.disabled=e.target.checked}
 if(e.target.id==='tk-rot'){const a=document.getElementById('rot-area');a.hidden=!e.target.checked;if(e.target.checked){if(!F.rot.length)F.rot=[F.assignee];const r=document.getElementById('tk-rep');if(r.value==='none')r.value='weekly';document.getElementById('tk-rotc').innerHTML=chipsHTML('fRot',F.rot,{ord:true})}}});
document.addEventListener('input',e=>{if(e.target.id==='an-text')document.getElementById('an-count').textContent=e.target.value.length+'/140'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.sheet'))close()});

window.addEventListener('online',()=>{setNet('reconnecting');flush();if(es&&es.readyState===2)connect()});
window.addEventListener('offline',()=>setNet('offline'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkReminders();if(store.mode==='family'&&(!es||es.readyState===2))connect();if(S)render(true)}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(UI.tab==='family'&&S)render(true)});
setInterval(checkReminders,30000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').then(r=>{swReg=r}).catch(()=>{});

// Açılış
if(store.mode==='demo'){S=store.demo||(store.demo=seed())}
else if(store.mode==='family'){if(store.R)fromRemote()}
const qcode=new URLSearchParams(location.search).get('aile');
if(qcode)history.replaceState(null,'',location.pathname);
UI.tf=S&&isChild()?'mine':'all';
render();
if(store.mode==='family'){connect();flush()}
checkReminders();
if(qcode&&!store.mode)A.joinSheet({code:qcode.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)});
})();
</script>
