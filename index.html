<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bizim Ev">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bizim Ev</title>
<meta name="description" content="Ailenin takvimi, görevleri ve listeleri tek yerde.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Telefonda tam ekran uygulama, altta 5 sekmeli menü; geniş ekranda ortada telefon genişliğinde bir çerçeve */
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --sunk:#F2EEE8; --line:#E4DED4; --fg:#22201D; --muted:#625B52; --live:#2EB872;
  --accent:#2E6A51; --on-accent:#FFFFFF; --accent-soft:#E1EDE6; --accent-ink:#22533F; --buy:#2E6A51; --buy-ink:#22533F; --wish:#7A4FB5; --wish-soft:#EFE6F8; --wish-ink:#5B3690;
  --coral:#B9502F; --coral-soft:#FBE9E2; --on-coral:#FFFFFF; --danger:#B3261E; --danger-soft:#FBE4E2; --warn:#7D5200; --warn-soft:#FFF0D2;
  --stage:#ECE7DF; --scrim:rgba(30,24,18,.38);
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16140F; --surface:#211E19; --sunk:#2B2721; --line:#3B362E; --fg:#F2EDE5; --muted:#ADA497; --live:#4CC98A;
  --accent:#8BCBA9; --on-accent:#0D2419; --accent-soft:#1F342A; --accent-ink:#A5DABD; --buy:#8BCBA9; --buy-ink:#A5DABD; --wish:#C7A8EE; --wish-soft:#2E2438; --wish-ink:#D9C3F5;
  --coral:#F29A80; --coral-soft:#3A251E; --on-coral:#2A140C; --danger:#F3A69F; --danger-soft:#3E201D; --warn:#F2C46E; --warn-soft:#3A2E15;
  --stage:#0D0C0A; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16140F; --surface:#211E19; --sunk:#2B2721; --line:#3B362E; --fg:#F2EDE5; --muted:#ADA497; --live:#4CC98A;
  --accent:#8BCBA9; --on-accent:#0D2419; --accent-soft:#1F342A; --accent-ink:#A5DABD; --buy:#8BCBA9; --buy-ink:#A5DABD; --wish:#C7A8EE; --wish-soft:#2E2438; --wish-ink:#D9C3F5;
  --coral:#F29A80; --coral-soft:#3A251E; --on-coral:#2A140C; --danger:#F3A69F; --danger-soft:#3E201D; --warn:#F2C46E; --warn-soft:#3A2E15;
  --stage:#0D0C0A; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}
html.big{font-size:125%}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:var(--stage);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased}
/* uygulama hissi: uzun basınca yazı seçilmesin, menü çıkmasın; yazı alanları hariç */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg{-webkit-user-drag:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:1.375rem;height:1.375rem;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:1.05rem;height:1.05rem}

.stage{height:100%;display:flex;justify-content:center;align-items:center}
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
/* Telefonda sayfa kaymasın; klavye kapandıktan sonra bir boşluk kalırsa da sayfayla aynı renkte görünsün */
@media (max-width:639px){body{background:var(--bg)}}
@media (min-width:640px){.phone{width:400px;height:min(860px,calc(100% - 48px));border-radius:36px;box-shadow:var(--shadow),0 0 0 10px var(--surface),0 0 0 11px var(--line)}}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 110px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

#tbar{position:absolute;left:0;right:0;top:0;z-index:6;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .22s}
#tbar.on{opacity:1;transform:none;pointer-events:auto}
#tbar .in{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px}
.tbs{display:flex;align-items:center;gap:12px}.tbs b{font-family:var(--f-display);font-size:1.2rem;font-weight:700;flex:none}
.tbs .seg{flex:1;padding:3px}.tbs .seg button{min-height:34px;font-size:.82rem;padding:0 4px}
.tbd{flex:1;min-width:0;color:var(--muted);font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbx{display:flex;align-items:center;gap:4px;flex:none}.tbs .icon-btn{width:38px;height:38px;flex:none}.tbs .bellb em{top:2px;right:2px}
.tbl{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tbl::-webkit-scrollbar{display:none}
.tbl button{flex:none;min-height:34px;padding:0 12px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--muted);white-space:nowrap}
.tbl button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tbt{text-align:center;font-weight:700;font-size:1.02rem;line-height:34px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.hdr .h{min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px;font-size:.95rem}
/* Grup başlıkları her yerde aynı: küçük, gri, büyük harf (iOS Ayarlar, Google Görevler). Gün başlıkları .cdh/.dhs: koyu. */
h2.sec,.lbl>span,.setsec,.rh,.tkday{font-family:var(--f-body);font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
h2.sec .qty{font-weight:700}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:26px 0 8px}
.link{color:var(--accent-ink);font-weight:600;font-size:.95rem;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:4px}
:root[data-theme="dark"] .link{color:var(--accent)}

.btn{min-height:48px;padding:0 18px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:.95rem}
.icon-btn{width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk)}
/* Ekran başlığının sağ üstündeki simge: Takvim'deki görünüm seçiciyle aynı boy ve zemin */
.hdr>.icon-btn{width:42px;height:42px;background:var(--sunk);color:var(--fg);flex:none}
[aria-disabled="true"]{opacity:.45}

.av{--c:#888;width:2rem;height:2rem;border-radius:999px;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex:none}
.av.lg{width:3.25rem;height:3.25rem;font-size:1.25rem}
.av.xl{width:5rem;height:5rem;font-size:1.8rem}
.av.xs{width:1.5rem;height:1.5rem;font-size:.7rem}
.avs{display:flex;flex:none}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-left:-8px}
/* Gelişmeler zili ve listesi */
.bellb{position:relative}.brow .bic{width:2rem;height:2rem;color:var(--accent-ink)}.thx .thbtn .bellb{width:44px;height:44px;color:var(--fg)}
.bellb em{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:var(--surface);font:700 .68rem/18px var(--f-body);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.brow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:60px;position:relative}
.brow+.brow{border-top:1px solid var(--line)}.brow .tx{flex:1;min-width:0;display:grid;gap:1px}.brow .tx b{font-weight:600;font-size:.94rem;line-height:1.3}.brow .tx small{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow time{font-size:.75rem;color:var(--muted);flex:none;align-self:flex-start;margin-top:3px}
.brow.un{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}.brow.un::before{content:"";position:absolute;left:5px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:999px;background:var(--accent)}
.bgrp{margin-bottom:6px}
.flyav{position:absolute;z-index:50;pointer-events:none;display:flex}.flyav .av{width:100%!important;height:100%!important}
/* Şu an burada (Google Dokümanlar gibi): uygulamada olan diğer kişiler */
.onhere{display:flex;align-items:center;gap:8px;margin:0 2px 14px;font-size:.88rem;color:var(--muted)}.onhere b{color:var(--fg);font-weight:600}.onhere .avs .av{box-shadow:0 0 0 2px var(--bg)}
.onhere i{width:8px;height:8px;border-radius:999px;background:var(--live);margin-left:auto;flex:none;animation:onp 2s ease-in-out infinite}@keyframes onp{50%{opacity:.35}}
.ltabs+.onhere{margin:10px 4px 4px}
/* Avatar görseli: kişinin renginin açık tonu üstünde, renkli halkayla */
.av.pic{overflow:hidden;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:2px solid var(--c)}
.av.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block;transform:translateY(6%) scale(1.06)}
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;border:1.5px solid var(--line);font-size:.72rem;font-weight:600;color:var(--muted);min-height:44px}
.avg button .av{width:3rem;height:3rem;font-size:1.1rem}
.avg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.swg{display:flex;flex-wrap:wrap;gap:10px}
.swg button{width:44px;height:44px;border-radius:999px;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 0 0 3px var(--surface);border:2px solid transparent}
.swg button[aria-pressed="true"]{border-color:var(--c)}
/* Alt sayfa açıkken bildirim üstteki boşlukta (sayfa en fazla ekranın 72px altına kadar uzar) */
.sheet{max-height:min(92%,calc(100% - 72px))}
.toast.top{top:10px;bottom:auto}
/* Alt sayfayı çizgiden ya da başlığından tutup aşağı çekerek kapatma */
.sheet .grip{box-sizing:content-box;padding:10px 60px 6px;margin:0 auto;background-clip:content-box;cursor:grab}
/* Satırı kaydırma: sağ = tamam, sol = sil */
.group{position:relative}
.row[data-sw],.lr[data-sw]{touch-action:pan-y}
.row.swiping,.lr.swiping{z-index:1;background:var(--surface)}
.swbg{position:absolute;left:0;right:0;z-index:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:.9rem}
.swbg span{display:inline-flex;align-items:center;gap:6px;opacity:.55;transition:opacity .15s,transform .15s}
.swbg.ok{background:var(--accent);color:var(--on-accent)}.swbg.ok span+span{visibility:hidden}
.swbg.del{background:var(--danger);color:var(--surface)}.swbg.del span:first-child{visibility:hidden}
.swbg.hot span{opacity:1;transform:scale(1.08)}
/* Sık eklenenler */
.sugg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 2px 2px}
.sugg small{color:var(--muted);font-weight:600;font-size:.8rem;margin-right:2px}
.row.shop{min-height:64px}.row.shop .t{font-size:1.08rem}
.sugg .group{width:100%}
.sugg .adh{display:block;margin:6px 4px 8px;width:100%}
.sgl .row{min-height:48px;padding:6px 14px;font-weight:500;gap:12px;border-radius:0;background:var(--surface);font-size:1rem}
.sgl .row .t{font-weight:500}
.sgl .pki{width:30px;height:30px;border-radius:9px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:none;color:var(--fg)}
.sgl .pki .i{width:17px;height:17px}
.sgs,.sugg .sgs{display:block;font-size:.8rem;color:var(--muted);font-weight:500;margin:1px 0 0}
.sgdue{font-style:normal;font-size:.7rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.sugg button:not(.row){min-height:40px;padding:0 12px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:4px}
/* Görev kutlaması ve çocuklar için haftalık yıldız */
.cf{position:absolute;width:8px;height:10px;border-radius:2px;pointer-events:none;z-index:40}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);font-weight:700;padding:6px 12px;border-radius:999px;font-size:.9rem;margin:0 0 12px}
/* Takvim: üst çubuk, akış günleri, ay ayrıntısı, tatil etiketleri */
.ctop{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.ctop h1{flex:1}
.ctop .add,.add.rnd{width:42px;height:42px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.cvw{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.cvw button{width:40px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cvw button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cbar{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}.cbar>*{flex:none}
.cwho,.ctg{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px 0 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:.88rem}
.cwho .fam{transform:scale(.75);margin:-4px}
.cwho .avs .av{width:1.4rem;height:1.4rem}
.cwho.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.ctg{padding:0 12px;color:var(--muted)}
.ctg[aria-pressed="true"],.ctg.on{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.cday{margin-bottom:12px}
.cdh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:4px 4px 6px}
.cdh b{font-family:var(--f-display);font-size:1.05rem}
.cdh>span{color:var(--muted);font-size:.85rem}
.cday.today .cdh b{color:var(--coral)}
.cemp{color:var(--muted);font-size:.82rem;padding:2px 4px 12px 4px}
.ctk{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:4px 14px 4px 12px;text-align:left;position:relative;color:var(--muted);font-weight:600;font-size:.9rem}
.cr+.ctk::before{content:"";position:absolute;top:0;left:4.6rem;right:0;border-top:1px solid var(--line)}
.ctk .ck0{width:3rem;display:flex;justify-content:flex-end}
.ctk .b{flex:1;min-width:0;padding-left:1.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctk em{color:var(--danger);font-style:normal}
.ctk .avs .av{width:1.4rem;height:1.4rem}
.cmore{color:var(--muted);text-align:center;font-size:.85rem;padding:14px 0 24px}
.hol{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.hol.resmi{background:var(--danger-soft);color:var(--danger)}
.hol.okul{background:var(--warn-soft);color:var(--warn)}
.strip .days{touch-action:pan-y}.mdet{touch-action:pan-y;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow)}
.mdet .dow{font-size:.7rem;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.mdet .d{min-height:74px;border-radius:10px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px 2px;min-width:0;text-align:left}
.mdet .d .num{align-self:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;width:1.6rem;height:1.6rem;display:flex;align-items:center;justify-content:center;border-radius:999px}
.mdet .d.today .num{background:var(--coral);color:#fff}
.mdet .d.out{opacity:.35}
.mdet .d.rsm .num{color:var(--danger)}
.mdet .d[aria-pressed="true"]{background:var(--accent-soft)}
.mdet .mb{display:block;font-size:.6rem;font-weight:600;line-height:1.25;padding:1px 3px;border-radius:4px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:clip}
.mdet .mb.sp{border-left:0;border-radius:0;margin:0 -3px;padding-left:4px;text-overflow:clip;position:relative;z-index:1}
.mdet .mb.sp:not(.hb){color:var(--fg)}.dtp.bad{box-shadow:0 0 0 2px var(--danger)}
.mdet .mb.sp.s{border-left:2px solid var(--c);border-radius:4px 0 0 4px;margin-left:0}
.mdet .mb.sp.e{border-radius:0 4px 4px 0;margin-right:0}.mdet .mb.sp.s.e{border-radius:4px;margin:0}
.mdet .mb.sp.ls{margin-left:0}.mdet .mb.sp.re{margin-right:0}
.mdet .mb.sp.gap{background:none;visibility:hidden}
.mdet .d{overflow:visible}
.mdet .mb.hb{--c:var(--danger);background:var(--danger-soft);color:var(--danger)}
.mdet .mb.hb.okul{--c:var(--warn);background:var(--warn-soft);color:var(--warn)}
.mdet .mb.hb.gun{--c:var(--muted);background:var(--sunk);color:var(--muted)}
.mdet .mm,.mdet .mt{font-size:.6rem;color:var(--muted);font-weight:700;padding-left:3px}
.cr.past{opacity:.5}
.cdh .cadd{margin-left:auto;width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);align-self:center}
.cprev{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:40px;color:var(--muted);font-weight:600;font-size:.88rem;margin-bottom:8px}
.avedit{position:relative;display:inline-flex;border-radius:999px;flex:none}

.thn .panel{grid-column:1/-1;position:relative;margin-top:8px;padding:14px 92px 14px 16px;border-radius:22px;background:linear-gradient(135deg,var(--s1),var(--s2));color:var(--sf);overflow:hidden;min-height:104px;display:flex;flex-direction:column;justify-content:center}

.thn.sky-n{--moon-dark:rgba(10,14,36,.55)}.thn.sky-e{--moon-dark:rgba(62,35,64,.18)}

@media (max-width:359px){.thn .panel{padding-right:72px}.thn .panel .moon2{width:60px;height:60px}.thn .panel .mbtn{right:6px}}

.sky-m{--s1:#FFE3C7;--s2:#FFF6E6;--sf:#4A2A12}.sky-d{--s1:#D6ECFA;--s2:#F2F8FC;--sf:#173A52}.sky-e{--s1:#F7C9B6;--s2:#E5D4F0;--sf:#3E2340}.sky-n{--s1:#1E2A4A;--s2:#36406B;--sf:#F1EEFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sky-m{--s1:#4A3320;--s2:#2E241B;--sf:#FFE9D2}:root:not([data-theme="light"]) .sky-d{--s1:#1C3A4F;--s2:#1A2730;--sf:#E2F2FC}:root:not([data-theme="light"]) .sky-e{--s1:#4D2E3A;--s2:#2F2840;--sf:#FBE6F0}}
:root[data-theme="dark"] .sky-m{--s1:#4A3320;--s2:#2E241B;--sf:#FFE9D2}:root[data-theme="dark"] .sky-d{--s1:#1C3A4F;--s2:#1A2730;--sf:#E2F2FC}:root[data-theme="dark"] .sky-e{--s1:#4D2E3A;--s2:#2F2840;--sf:#FBE6F0}

/* Panoda herkesin mesajı: tek satır, dokundukça sıradakine geçer (Apple Hava uyarıları gibi) */

.pstrip>*{position:relative}
.pmc{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 4px 11px 14px;color:inherit;min-height:54px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .thn .panel .hchip{background:rgba(255,255,255,.12)}}:root[data-theme="dark"] .thn .panel .hchip{background:rgba(255,255,255,.12)}
/* Duyuru notu: sıcak kâğıt, hafif eğik, üstte yazanın avatarı raptiye gibi */

/* Sıradaki etkinlik */

/* Evde: alınacaklar ve aile fikri */
.cl{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}

.qa button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.9rem;padding:8px 4px;text-align:center}
.qa button .ic{width:2.25rem;height:2.25rem;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}

.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;text-align:left;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;display:block;overflow-wrap:anywhere}

.chk{width:48px;height:48px;margin:-6px -6px -6px -8px;display:flex;align-items:center;justify-content:center;flex:none}
.chk span{width:1.75rem;height:1.75rem;border-radius:999px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s}
.chk[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.moods button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.idea{background:var(--accent-soft);border-radius:var(--r-lg);padding:14px 16px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}

/* Segmented + chips */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}

.chips::-webkit-scrollbar{display:none}

/* Kişi seçimi: yuvarlak avatar, isim altta; çocuklar alt satırda biraz küçük. Seçilende yeşil halka ve tik. */

.wheel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:18px 23% 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.wheel::-webkit-scrollbar{display:none}
.wcard{flex:0 0 54%;scroll-snap-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 10px 18px;border-radius:26px;background:color-mix(in srgb,var(--c) 12%,var(--surface));box-shadow:var(--shadow);will-change:transform}
.wcard .av{box-shadow:0 0 0 4px var(--surface);margin-bottom:8px}
.wcard b{font-family:var(--f-display);font-size:1.25rem}
.wcard .rl{color:var(--muted);font-size:.85rem}
.wcard .you{position:absolute;top:12px;right:12px;font-size:.75rem;font-weight:600;color:var(--muted);background:var(--surface);border-radius:999px;padding:2px 8px}
.wcard.mid{box-shadow:0 0 0 2px var(--c),var(--shadow)}
.wday{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.wday .wd{flex:none;width:40px;display:flex;flex-direction:column;align-items:center;padding-top:12px;line-height:1.1}
.wday .wd b{font-family:var(--f-display);font-size:1.35rem}
.wday .wd small{color:var(--muted);font-size:.72rem;font-weight:600}
.wday .cl{flex:1;min-width:0}
.cr{display:grid;grid-template-columns:3rem 1.5rem minmax(0,1fr) auto;align-items:center;gap:0 8px;min-height:52px;padding:4px 12px 4px 8px;position:relative}
.cr+.cr::before{content:"";position:absolute;top:0;left:4.4rem;right:0;border-top:1px solid var(--line)}
.cr .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:.92rem;text-align:right}
.cr .tm.mu{color:var(--muted);font-weight:500;font-size:.8rem}
.cr .tm.late{color:var(--danger);font-size:.8rem}
.cr .mk{display:flex;align-items:center;justify-content:center}
.cr .dot{width:10px;height:10px;border-radius:999px;background:var(--c)}
.cr .ck{width:44px;height:44px;margin:-11px;display:flex;align-items:center;justify-content:center;color:transparent;padding:0}
.cr .ck::before{content:"";position:absolute;width:22px;height:22px;border-radius:999px;border:2px solid color-mix(in srgb,var(--c) 70%,var(--line));box-sizing:border-box}
.cr .ck[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.cr .ck[aria-pressed="true"]{color:var(--on-accent)}
.cr .ck .i{width:14px;height:14px;position:relative}
.cr .ti{text-align:left;min-width:0;display:block;padding:6px 0}
.cr .ti b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .ti small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cr .who{display:flex;align-items:center}
.cr .who .fam{transform:scale(.8)}
/* Konuşur gibi ekleme */
.sain{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--accent);color:var(--accent-ink)}
.sain input{flex:1;min-width:0;border:0;background:none;font-size:1.08rem;color:var(--fg);outline:none;min-height:52px}
.sap{margin-top:12px;background:var(--surface);border-radius:var(--r-lg);padding:12px 14px 14px;box-shadow:var(--shadow)}
.sakind{margin:0 0 10px}
.sakind button{min-height:36px;font-size:.88rem}
.sat{font-family:var(--f-display);font-size:1.3rem;font-weight:700;line-height:1.25;margin:2px 2px 10px}
.sacs{display:flex;flex-wrap:wrap;gap:6px}
.sac{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px 0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:.88rem}
.sac .avs .av{width:1.4rem;height:1.4rem}
.sac .fam{transform:scale(.75);margin:-4px}
.sac.dim{background:var(--sunk);color:var(--muted);font-weight:500}
.saact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.saact .btn[disabled]{opacity:.45}
.sain{padding-right:6px}.sago{display:flex;width:42px;height:42px;border-radius:999px;background:var(--accent);color:#fff;align-items:center;justify-content:center;flex:none}.sago .i{width:20px;height:20px}
#sa-prev .saact .btn.primary{display:none}
/* Altta tek sırada dört renkli simge (WhatsApp ek menüsü gibi) */
.saalt{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.saalt button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.84rem;font-weight:600;color:var(--fg);min-height:84px}
.saalt .ic{width:54px;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.saalt .ic .i{width:24px;height:24px}
.wdots{display:flex;justify-content:center;gap:6px;margin:4px 0 2px}
.wdots i{width:7px;height:7px;border-radius:999px;background:var(--line);transition:width .2s,background .2s}
.wdots i.on{width:20px;background:var(--c)}
.invlink{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin-top:6px;color:var(--muted);font-weight:600;font-size:.88rem}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:60px}
.setrow+.setrow{border-top:1px solid var(--line)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* Alt menü */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);border-radius:16px}
.nav button .pill{width:3.5rem;height:2rem;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .15s}
/* Seçili sekme "Dolgu" (Apple, Instagram gibi): hap yok; simge dolar, koyulaşır ve hafifçe büyür */
.nav button .i{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nav button[aria-current="page"]{color:var(--accent-ink);font-weight:800}
.nav button[aria-current="page"] .i{transform:scale(1.12);stroke-width:2.2}
.nav button[aria-current="page"] .i *{fill:color-mix(in srgb,var(--accent) 28%,transparent)}
/* Ortadaki artı: her sekmede tek ekleme düğmesi */
.nav .navadd{border-radius:999px}
.navadd span{width:54px;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--on-accent);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:0 0 0 4px var(--surface),0 8px 18px color-mix(in srgb,var(--accent) 45%,transparent);transform:translateY(-10px);transition:transform .2s}
.navadd .i{width:26px;height:26px;transition:transform .25s}
.navadd:active span{transform:translateY(-10px) scale(.94)}
body:has(#layer .sheet) .navadd .i{transform:rotate(45deg)}

/* Sheet, toast */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s}
.sheet.pgrow{animation:none}.scrim.pgrow{animation:fade .3s}
/* Ortadaki cam çarpı: artı yerinde kalır, su damlası gibi şeffaf bir düğmeye dönüşür (sağ üstteki küçük çarpının yerine) */
:root{--gl-bg:radial-gradient(circle at 50% 58%,rgba(255,255,255,.35) 38%,color-mix(in srgb,var(--accent) 12%,rgba(60,70,80,.10)) 72%,color-mix(in srgb,var(--accent) 22%,rgba(40,50,60,.28)) 100%);--gl-bd:rgba(255,255,255,.9);
 --gl-sh:inset 0 1.5px 1px #fff,inset 0 -1px 1.5px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.10),0 10px 18px -8px rgba(0,0,0,.35),0 2px 5px rgba(0,0,0,.06);--gl-hi:#fff;--gl-ca:rgba(255,255,255,.95);--gl-fg:#1E1B16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gl-bg:radial-gradient(120% 120% at 50% 110%,rgba(255,255,255,.22),rgba(255,255,255,.06) 55%,rgba(255,255,255,.02));--gl-bd:rgba(255,255,255,.28);
 --gl-sh:inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -5px 10px rgba(255,255,255,.12),0 10px 24px -6px rgba(0,0,0,.6);--gl-hi:rgba(255,255,255,.55);--gl-ca:rgba(255,255,255,.55);--gl-fg:#fff}}
:root[data-theme="dark"]{--gl-bg:radial-gradient(120% 120% at 50% 110%,rgba(255,255,255,.22),rgba(255,255,255,.06) 55%,rgba(255,255,255,.02));--gl-bd:rgba(255,255,255,.28);
 --gl-sh:inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -5px 10px rgba(255,255,255,.12),0 10px 24px -6px rgba(0,0,0,.6);--gl-hi:rgba(255,255,255,.55);--gl-ca:rgba(255,255,255,.55);--gl-fg:#fff}
.pxc{position:absolute;z-index:23;padding:0;border-radius:999px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--gl-fg);background:var(--gl-bg);border:1px solid var(--gl-bd);box-shadow:var(--gl-sh);-webkit-backdrop-filter:blur(8px) saturate(180%);backdrop-filter:blur(8px) saturate(180%)}
.pxc::before{content:"";position:absolute;left:15%;top:9%;width:44%;height:30%;border-radius:50%;background:radial-gradient(closest-side,var(--gl-hi),transparent);transform:rotate(-24deg);pointer-events:none}
.pxc::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(55% 35% at 52% 90%,var(--gl-ca),transparent 70%);pointer-events:none}
.pxc .i{position:relative;z-index:1;width:26px;height:26px;transform:rotate(45deg)}
.pxc:active{transform:scale(.93)}
.sheet.pxs .sh .icon-btn{display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:26px 26px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 20px;gap:8px}
.sheet .sh h3{font-family:var(--f-display);font-size:1.3rem;margin:0;flex:1;min-width:0}
/* Ayrıntı penceresinde Düzenle ve Sil başlıkta simge (Google Takvim gibi); altta yalnızca asıl iş */
.sheet .sh .sht{width:40px;height:40px;background:var(--sunk);color:var(--fg);flex:none}
.sheet .sh .sht.dg{color:var(--danger)}
.sheet .sh .sht+.icon-btn{margin-left:2px}
.sheet .sb{overflow-y:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.flabel{font-weight:600;font-size:.9rem}
.inp{min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:10px 14px;font-size:1rem;width:100%}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
details.more{border-top:1px solid var(--line);margin:4px 0 14px}
details.more summary{min-height:52px;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--accent-ink);cursor:pointer;list-style:none}
:root[data-theme="dark"] details.more summary{color:var(--accent)}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary svg{transform:rotate(180deg)}
.tkfree{padding:12px 16px;color:var(--muted);font-size:.9rem}
.tkmore{display:flex;align-items:center;gap:6px;width:100%;min-height:48px;margin-top:18px;padding:0 6px;font-weight:700;color:var(--accent-ink)}
.tkmore .n{margin-left:auto;color:var(--muted);font-weight:600;font-size:.85rem}
.tkday{margin:18px 6px 6px}
.cdh.tkdh{margin:18px 4px 6px}.cdh.tkdh small{margin-left:auto;color:var(--muted);font-weight:600;font-size:.8rem}
.tknx{color:var(--accent-ink);font-weight:600}
:root[data-theme="dark"] .tkmore,:root[data-theme="dark"] .tknx{color:var(--accent)}
.note{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin:-4px 0 12px}
.err{color:var(--danger);font-size:.875rem;font-weight:600}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1}
.dl{display:grid;gap:12px;margin:8px 0 18px}
a.btn{text-decoration:none}
.wpbox{border-radius:16px;background:var(--sunk);padding:12px 14px;display:grid;gap:10px}
.wpbox .st{display:flex;align-items:flex-start;gap:8px;font-size:.85rem;color:var(--muted)}
.wpbox .st .i{flex:none;margin-top:1px}.wpbox .st b{color:var(--fg);font-weight:600}
.wprow{display:flex;gap:8px}.wprow .inp{flex:1;min-width:0}
.wpcard{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:16px;padding:10px 6px 10px 12px}
.wpcard>.i{color:var(--accent-ink);margin-top:2px;flex:none}
.wpcard .tx{flex:1;min-width:0;display:grid;gap:2px}.wpcard .tx b{font-weight:700;overflow-wrap:anywhere}.wpcard .tx span{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.wpcard .src{font-size:.75rem;color:var(--accent-ink);font-weight:600}
.wpcard .x{width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;margin-top:-4px}
.dl div{display:flex;gap:12px;align-items:flex-start}
.dl svg{color:var(--muted);margin-top:1px}
.toast{position:absolute;left:14px;right:14px;bottom:92px;z-index:30;background:var(--fg);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;min-height:52px;box-shadow:var(--shadow);animation:up2 .2s}
.toast .msg{flex:1;font-weight:500}
.toast button{color:var(--bg);font-weight:700;min-height:44px;padding:0 12px;border-radius:12px;text-decoration:underline;text-underline-offset:3px}
@keyframes up2{from{transform:translateY(20px);opacity:0}}
.dgroup{margin-bottom:18px}
.dgroup .flabel{display:block;margin-bottom:8px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.people{display:grid;gap:6px}
.people button{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:14px;text-align:left;border:1.5px solid transparent}
.people button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.people small{display:block;color:var(--muted);font-size:.8rem}

/* Yükleniyor / hata */
.sk{background:var(--sunk);border-radius:14px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
:root[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@keyframes sh{to{transform:translateX(100%)}}
.state-err{text-align:center;padding:60px 12px}
.state-err .ic{width:64px;height:64px;border-radius:999px;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.child-hint{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-md);padding:10px 14px;font-weight:600;font-size:.9rem;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:32px;padding-block:24px 40px}
.welcome .logo{width:76px;height:76px;border-radius:22px;display:block;box-shadow:var(--shadow)}
.welcome h1{font-size:2.4rem;margin-top:18px}
.welcome .lead{color:var(--muted);font-size:1.1rem;max-width:30ch;margin:8px 0 0}
.welcome .acts{display:grid;gap:10px}
.welcome .acts .btn{min-height:56px;font-size:1.05rem}
.netbar{position:absolute;top:0;left:0;right:0;z-index:8;background:var(--warn-soft);color:var(--warn);font-size:.85rem;font-weight:600;padding:calc(6px + env(safe-area-inset-top,0px)) 16px 6px;text-align:center}
.phone.off .screen{padding-top:calc(48px + env(safe-area-inset-top,0px))}
.demobar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:var(--r-md);padding:6px 6px 6px 14px;font-size:.9rem;font-weight:600;margin-bottom:14px}
.demobar{flex-wrap:wrap}.demobar>span{flex:1 1 190px}.demobar .btn{margin-left:auto;white-space:nowrap}
.codebox .inp{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.15em;text-transform:uppercase;text-align:center}
.btn[disabled]{opacity:.6;cursor:progress}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Gün akışı: günler alt alta, üstte kaydırmayı izleyen hafta şeridi */
.ag{display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;align-items:center;gap:12px;margin:0 0 8px 2px}
.dnum{width:2.75rem;height:2.75rem;border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1;font-variant-numeric:tabular-nums}
.dnum b{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.dnum small{font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.dblock.today .dnum{background:var(--coral);color:var(--on-coral)}
.dblock.today .dnum small{color:inherit;opacity:.85}
.dhead .h{flex:1;min-width:0;display:flex;flex-direction:column}
.dhead .h b{font-weight:700;font-size:1.02rem}
.dhead .h small{color:var(--muted);font-size:.85rem}
.dadd{width:44px;height:44px;border-radius:999px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.dadd:hover{background:var(--sunk)}
.dempty{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 2px 0 14px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted)}
.dempty .h{flex:1;font-weight:600;font-size:.9rem}
.dempty .h small{font-weight:500;margin-left:6px}
.mbar.dash{background:repeating-linear-gradient(to bottom,var(--c) 0 5px,transparent 5px 9px)}
.ctask .chk{margin:-6px -8px -6px 0}
.dots i.tk{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.dblock.flash>.group,.dblock.flash.dempty{animation:flash 1.4s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--accent)}}
.strip{background:var(--bg);margin:0 -18px 12px;padding:4px 14px 8px}
.strip.sticky{position:sticky;top:calc(var(--tbh,0px) - 20px);z-index:3;padding-top:24px;border-bottom:1px solid var(--line)}
.strip .sh{display:flex;align-items:center;gap:4px;margin-bottom:4px;padding:0 4px}
.strip .sh .ttl{flex:1;text-align:center;font-family:var(--f-display);font-weight:600;font-size:1.15rem}
/* Takvim'de Akış ile Ay görünümünün ay satırı aynı yerde ve aynı boyutta durur (yapışkan şerit aynı kalır) */
.ctop+.strip.sticky{padding-top:4px}
.strip .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip .days button{min-height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;padding:4px 0}
.strip .days small{font-size:.66rem;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.strip .days b{font-size:1.02rem;width:1.9rem;height:1.9rem;display:flex;align-items:center;justify-content:center;border-radius:999px}
.strip .days button[aria-current="date"] b{background:var(--coral);color:var(--on-coral)}
.strip .days button[aria-pressed="true"]{background:var(--accent-soft)}
/* Bugün: sade şerit (Apple Takvim gibi): seçili gün koyu yuvarlak, bugün renkli yazı; gün başlıkları tek satır */
.hs1 .strip.sticky{padding-bottom:6px}
.hs1 .strip .days button{min-height:54px;background:none!important;gap:2px}
.hs1 .strip .days small{font-size:.64rem}
.hs1 .strip .days b{width:2rem;height:2rem;transition:background .2s,color .2s}

const evLen=e=>e.end&&e.end>e.date?daysBetween(e.date,e.end)+1:1;

function evStart(e,day){const n=evLen(e);for(let k=0;k<n;k++){const s=add(day,-k);if(occ1(e,s))return s}return null}
const evIdx=(e,day)=>{const s=evStart(e,day);return s?daysBetween(s,day)+1:1};

function occ1(e,day){if(day<e.date)return false;if(day===e.date)return true;const a=parse(e.date),b=parse(day);
 switch(e.repeat){case 'daily':return true;case 'weekly':return a.getDay()===b.getDay();case 'monthly':return a.getDate()===b.getDate();case 'yearly':return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()}return false}

/* ---------- Gün akışı ----------

  &&(x.done?doneDay(x)===day:(x.due===day||(day===t&&x.due<t))))
  .sort((a,b)=>tkKey(a,day)<tkKey(b,day)?-1:1)}

let SLIM=false; // Bugün'deki akışta gün başlıkları tek satır

// Görevler: Bugün · Yaklaşan · Rutinler (Todoist/Things'in Bugün–Yaklaşan ayrımı + Hearth'ın rutinleri).
// Bugün: gecikenler, senin bugünün, ailenin bugünü; bugün bitenler altta katlanır. Tekrarlayan işler Rutinler'de bir kez durur.
// Çocuk yalnızca kendi görevlerini görür.
function vTasks(){
 const t=T(),mine=meId(),v=UI.tkb||'today',kid=isChild(),vis=x=>!kid||isFor(x,mine);
 const byDue=(a,b)=>(a.due+(a.time||'99')).localeCompare(b.due+(b.time||'99')),open=S.tasks.filter(x=>!x.done&&vis(x)).sort(byDue);
 const sec=(n,a,red)=>`<div class="sec-h" style="margin-top:20px"><h2 class="sec"${red?' style="color:var(--danger)"':''}>${n}</h2><small style="color:var(--muted)">${a.length}</small></div>`;
 let body='';
 // Yapılan iş gün bitene kadar kendi bölümünün altında, kimin yaptığıyla durur (Skylight gibi). Az önce işaretlenen, kısa bir süre yerinde kalıp kayar (dcKeep)
 if(v==='today'){const mid=parse(t).getTime(),K=UI.dcKeep,kp=x=>x.done&&K.has(x.id),vi=x=>vis(x)&&(!x.done||kp(x));
  const late=S.tasks.filter(x=>vi(x)&&x.due<t).sort(byDue),td=S.tasks.filter(x=>vi(x)&&x.due===t).sort(byDue),dn=S.tasks.filter(x=>x.done&&vis(x)&&!kp(x)&&(x.doneAt||0)>=mid).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  const my=td.filter(x=>isFor(x,mine)),oth=td.filter(x=>!isFor(x,mine)),dm=dn.filter(x=>isFor(x,mine)),dO=dn.filter(x=>!isFor(x,mine));
  const H=(n,a,d,red)=>{const all=a.length+d.length,ok=d.length+a.filter(x=>x.done).length;return `<div class="sec-h" style="margin-top:20px"><h2 class="sec"${red?' style="color:var(--danger)"':''}>${n}</h2><small style="color:var(--muted)">${red?a.filter(x=>!x.done).length:all?ok+'/'+all:0}</small></div>`};
  body=(late.length?H('Geciken',late,[],1)+`<div class="group">${late.map(taskRow).join('')}</div>`:'')
   +H(kid?'Bugün':'Senin bugünün',my,dm)+`<div class="group">${my.concat(dm).map(taskRow).join('')||`<div class="tkfree">${late.length?'Bugüne başka işin yok.':'Bugün sana iş yok.'}</div>`}</div>`
   +(oth.length||dO.length?H('Ailenin bugünü',oth,dO)+`<div class="group">${oth.concat(dO).map(taskRow).join('')}</div>`:'')
   +`<button class="tkmore" data-act="tkb" data-v="dn">${I('chevR','sm')}Bütün yapılanlar</button>`}
 // Yapılanlar: bu hafta kim kaç iş yaptı, altında son iki hafta gün gün (Things'in kayıt defteri gibi)
 if(v==='dn'){const from=add(t,-13),fm=parse(monday(t)).getTime(),D=S.tasks.filter(x=>x.done&&vis(x)&&x.doneAt&&iso(new Date(x.doneAt))>=from),dd=x=>iso(new Date(x.doneAt));
  const wk=ordMe().filter(m=>!kid||m.id===mine).map(m=>({m,n:D.filter(x=>(x.doneBy||x.assignee)===m.id&&x.doneAt>=fm).length}));
  const days=[...new Set(D.map(dd))].sort().reverse();
  body=`<div class="dcsum"><b>Bu hafta</b><div>${wk.map(({m,n})=>`<span>${av(m.id,'sm')}<em>${n}</em>${esc(first(m.name))}</span>`).join('')}</div></div>`
   +(days.map(d=>{const a=D.filter(x=>dd(x)===d).sort((x,y)=>y.doneAt-x.doneAt);const hd=dHead(d);return `<div class="cdh tkdh"><b>${hd.b}</b><span>${hd.s}</span><small>${a.length}</small></div><div class="group">${a.map(taskRow).join('')}</div>`}).join('')
    ||`<div class="group" style="margin-top:16px">${emptyBox('Henüz yapılan yok','Tamamlanan görevler burada gün gün durur.')}</div>`)
   +`<p class="note" style="margin-top:12px">${I('info','sm')}<span>Son iki hafta. Yanlışlıkla işaretlediğini satırdaki daireye dokunarak geri açabilirsin.</span></p>`}
 if(v==='up'){const up=open.filter(x=>x.due>t),days=[...new Set(up.map(x=>x.due))];
  body=days.map(d=>{const a=up.filter(x=>x.due===d),hd=dHead(d);return `<div class="cdh tkdh"><b>${hd.b}</b><span>${hd.s}</span></div><div class="group">${a.map(taskRow).join('')}</div>`}).join('')
   ||`<div class="group" style="margin-top:16px">${emptyBox('Yaklaşan görev yok','Bugünden sonrası için eklenen görevler burada gün gün görünür.')}</div>`}
 if(v==='rt'){const R=Object.entries(TREP).filter(([k])=>k!=='none'),rt=S.tasks.filter(x=>x.repeat&&x.repeat!=='none'&&!x.done&&vis(x));
  body=`<p class="note" style="margin-top:12px">${I('repeat','sm')}<span>Tekrarlayan işler burada bir kez durur; sıranın kimde olduğunu ve bir sonraki günü gösterir.</span></p>`
   +(R.map(([r,n])=>{const a=rt.filter(x=>x.repeat===r);return a.length?`<div class="tkday">${esc(n)}</div><div class="group">${a.map(x=>{const nx=nextIn(x);return `<div class="row"><span class="wic">${I('repeat','sm')}</span><button class="body tap" style="text-align:left" data-act="openTask" data-id="${x.id}"><span class="t">${esc(x.title)}</span><span class="m">${whoHTML(x,true)}<span>${I('clock','sm')}${rel(x.due)}${x.time?' · '+hm(x.time):''}</span>${nx?`<span class="tag rot">Sırada: ${esc(M(nx).name)}</span>`:''}</span></button></div>`}).join('')}</div>`:''}).join('')
   ||`<div class="group">${emptyBox('Rutin yok','Bir görevi eklerken “Daha fazla seçenek”ten tekrar seçersen burada durur.')}</div>`)}
 // Yapılanlar sekme değil, kendi sayfası (Things'in kayıt defteri gibi): sağ üstteki düğme ya da Bugün'ün altındaki bağlantı açar
 if(v==='dn')return `<div class="hdr"><div class="h"><button class="lback" data-act="tkb" data-v="today">${I('chevL','sm')}Görevler</button><h1>Yapılanlar</h1></div></div>${body}`;
 return `<div class="hdr"><div class="h"><h1>Görevler</h1></div><button class="icon-btn" data-act="tkb" data-v="dn" aria-label="Yapılanlar">${I('dnic')}</button></div>${kid?starsHTML():''}
 <div class="seg" role="group" aria-label="Görünüm">${tkSeg(v)}</div>${body}`}
const TKV=[['today','Bugün'],['up','Yaklaşan'],['rt','Rutinler']],tkSeg=v=>TKV.map(([k,n])=>`<button data-act="tkb" data-v="${k}" aria-pressed="${v===k}">${n}</button>`).join('');
// Aşağı kayınca üstte kalan şerit (Microsoft To Do gibi): sayfanın büyük başlığı ekrandan çıkınca küçük başlık ve o sayfanın sekmeleri buzlu bir şeritte görünür.
// tbIn() her sayfa için [izlenen öğe, şeridin içi] verir; #screen kaydıkça ve her çizimden sonra tbPaint() günceller.

const tbBtn=(act,data,on,n)=>`<button data-act="${act}" ${data} aria-pressed="${on}">${esc(n)}</button>`;
function tbIn(sc){const t=UI.tab,q=x=>sc.querySelector(x);if(!S||!store.mode)return [null,''];
 if(t==='tasks'){const v=UI.tkb||'today';return [q('.hdr h1'),v==='dn'?`<div class="tbt">Yapılanlar</div>`:`<div class="tbs"><b>Görevler</b><div class="seg" role="group" aria-label="Görünüm">${tkSeg(v)}</div></div>`]}
 if(t==='today')return [q('.th .panel'),`<div class="tbs"><b>Bugün</b><span class="tbd">${long(T())}</span><span class="tbx">${wxChip()}${bellBtn()}</span></div>`];
 if(t==='cal'){const c=calTop().match(/<div class="cvw"[^]*?<\/div>/);return [q('.ctop h1'),`<div class="tbs"><b>Takvim</b><span class="tbd">${UI.cal==='month'&&UI.calDate?(d=>MON[d.getMonth()]+' '+d.getFullYear())(parse(UI.calDate)):''}</span>${c?c[0]:''}</div>`]}
 if(t==='lists'&&!UI.shop){const w=UI.lmode==='wish',tb=w?Object.entries(WTAB).map(([k,[,n]])=>tbBtn('wt',`data-v="${k}"`,UI.wt===k,n)):S.lists.map(l=>tbBtn('pickList',`data-id="${l.id}"`,l.id===UI.list,l.name));
  const mk=w?0:S.items.filter(i=>!i.done&&i.cat==='Market').length;
  return [q('.wtabs')||q('.ltabs'),`<div class="tbs"><b style="color:var(${w?'--wish-ink':'--buy-ink'})">${w?'İstekler':'Alınacaklar'}</b><div class="tbl" role="group" aria-label="${w?'Tür':'Listeler'}">${tb.join('')}</div>${mk?`<button class="icon-btn" data-act="shopStart" data-v="Market" aria-label="Marketteyim">${I('cart')}</button>`:''}</div>`]}
 if(t==='family')return [q('.hdr h1'),`<div class="tbs"><b>Aile</b><span class="tbd"></span><button class="icon-btn" data-act="famSettings" aria-label="Ayarlar">${I('gear')}</button></div>`];
 if(t==='lib')return [q('.hdr h1'),`<div class="tbs"><button class="icon-btn" data-act="tab" data-tab="${UI.libFrom==='lists'?'lists':'family'}" aria-label="Geri">${I('chevL')}</button><b>Ev kütüphanesi</b><span class="tbd">${LIB().length} kitap</span></div>`];
 return [null,'']}
function tbPaint(){const bar=document.getElementById('tbar'),sc=document.getElementById('screen');if(!bar||!sc)return;
 const [h,in_]=tbIn(sc);if(!h){bar.className='';bar.innerHTML='';bar._k='';sc.style.removeProperty('--tbh');return}
 if(bar._k!==in_){bar.innerHTML=`<div class="in">${in_}</div>`;bar._k=in_;const on=bar.querySelector('.tbl [aria-pressed="true"]');if(on)on.scrollIntoView({block:'nearest',inline:'center'})}
 const on=h.getBoundingClientRect().bottom<sc.getBoundingClientRect().top+30;bar.style.top=sc.offsetTop+'px';bar.classList.toggle('on',on);bar.inert=!on;
 sc.style.setProperty('--tbh',on?bar.offsetHeight+'px':'0px')}

function bindWheel(){const w=document.getElementById('wheel');if(!w)return;const cs=[...w.children],n=cs.length/3,flat=calm();
 const center=el=>el.offsetLeft+el.offsetWidth/2-w.clientWidth/2;
 const paint=()=>{const mid=w.scrollLeft+w.clientWidth/2;cs.forEach(c=>{const d=(c.offsetLeft+c.offsetWidth/2-mid)/c.offsetWidth,a=Math.min(Math.abs(d),2);
  c.style.transform=flat?`scale(${1-a*.1})`:`perspective(700px) rotateY(${-d*32}deg) scale(${1-a*.14})`;c.style.opacity=String(1-a*.35);c.classList.toggle('mid',a<.5)})};
 const nearest=()=>{const mid=w.scrollLeft+w.clientWidth/2;return cs.reduce((b,c)=>Math.abs(c.offsetLeft+c.offsetWidth/2-mid)<Math.abs(b.offsetLeft+b.offsetWidth/2-mid)?c:b)};
 w.scrollLeft=center(cs.find(c=>c.dataset.c==='1'&&c.dataset.id===UI.wsel)||cs[n]);paint();
 let raf=0,to;const settle=()=>{clearTimeout(to);
  let c=nearest();const ci=+c.dataset.c;if(ci!==1){const tw=cs[cs.indexOf(c)+(ci===0?n:-n)];w.scrollLeft+=center(tw)-center(c);c=tw;paint()}
  if(UI.wsel!==c.dataset.id){UI.wsel=c.dataset.id;const s=document.getElementById('wsel');if(s)s.innerHTML=wselHTML(c.dataset.id);
   const ids=cs.slice(0,n).map(x=>x.dataset.id);document.querySelectorAll('.wdots i').forEach((d,i)=>d.classList.toggle('on',ids[i]===c.dataset.id))}};
 w.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;paint()});clearTimeout(to);to=setTimeout(settle,150)},{passive:true});w.addEventListener('scrollend',settle)}

// Sık alınanlar: listede bekleyenler hariç, yazdıkça süzülür. Önce genel market ürünleri, sonra ailenin daha önce aldıkları.
// Alışveriş hafızası (freq): her eklenen ürün sayılır; öneriler en çok eklenenlerden gelir.
// Hafıza boşken (yeni aile) genel market ürünleri gösterilir.
const COMMON=['Süt','Ekmek','Yumurta','Peynir','Domates','Zeytin','Çay','Deterjan'];
const fid=n=>{let h=5381;const k=low(n.trim());for(let i=0;i<k.length;i++)h=(h*33^k.charCodeAt(i))>>>0;return 'f'+h.toString(36)+k.length};
// İki ekleme arası gün ortalaması da tutulur (ileride "zamanı gelenler" için).
function remember(nm){S.freq=S.freq||[];const id=fid(nm),f=S.freq.find(x=>x.id===id),now=Date.now();
 if(!f){S.freq.push({id,name:nm,n:1,every:0,last:now});return}
 const gap=(now-f.last)/864e5;f.n++;if(gap>.5)f.every=f.every?Math.round((f.every*.7+gap*.3)*10)/10:Math.round(gap*10)/10;f.last=now;f.name=nm}
function suggHTML(q){const L=F.list||UI.list,have=new Set(S.items.filter(i=>i.list===L&&!i.done).map(i=>low(i.name)));q=low(q.trim());
 const fr=(S.freq||[]).filter(f=>f.n>=2);
 const pool=(fr.length?[...fr].sort((a,b)=>b.n-a.n).map(f=>f.name):COMMON).filter(n=>!have.has(low(n))&&(!q||low(n).includes(q))&&low(n)!==q).map(n=>({n,i:sgInfo(n)}));
 // Ortalamasını geçenler ("Vakti geldi") ortalamaya en çok aşanlardan başlayarak öne çıkar; gerisi en çok eklenenler sırasıyla kalır
 pool.sort((a,b)=>(b.i.due-a.i.due)||(a.i.due?b.i.r-a.i.r:0));
 const top=pool.slice(0,5),lb=q?'Öneriler':pool.some(x=>x.i.due)?'Sıradakiler':fr.length?'En çok eklediklerin':'Sık alınanlar';
 return top.length?`<div class="adh">${lb}</div><div class="group sgl">${top.map(({n,i})=>{const sub=[i.ago!=null?gunOnce(i.ago)+' alındı':'',i.ev?`ortalama ${i.ev} günde bir`:''].filter(Boolean).join(' · ');
  return `<button type="button" class="row" data-act="sugAdd" data-v="${esc(n)}"><span class="pki">${I('plus')}</span><span class="body"><span class="t">${esc(n)}${i.due?'<em class="sgdue">Vakti geldi</em>':''}</span>${sub?`<small class="sgs">${sub}</small>`:''}</span></button>`}).join('')}</div>`:''}
const gunOnce=d=>d===0?'bugün':d===1?'dün':d+' gün önce';
// Son alınış: o addaki alınmış ürünlerin en yenisi, yoksa listeye son eklenişi; ortalama: freq.every (iki ekleme arası gün)
function sgInfo(n){const k=low(n),f=(S.freq||[]).find(x=>low(x.name)===k),ds=S.items.filter(i=>i.done&&i.doneAt&&low(i.name)===k).map(i=>i.doneAt);
 const last=ds.length?Math.max(...ds):(f&&f.last)||0,ago=last?Math.max(0,Math.floor((Date.now()-last)/864e5)):null,ev=f&&f.every>=1?Math.round(f.every):null;
 return {ago,ev,due:ago!=null&&!!ev&&ago>=ev,r:ago!=null&&ev?ago/ev:0}}
// Alışveriş modu: seçilen mağaza türündeki (kategori) ürünler bütün listelerden tek ekranda; market için reyonlara göre
const REYON=[['Temizlik & kağıt',['deterjan','tuvalet kağıdı','peçete','sabun','çamaşır suyu','bulaşık']],['Meyve & sebze',['domates','salatalık','patates','soğan','muz','elma','limon','meyve','sebze','biber','marul']],['Süt & kahvaltılık',['süt','peynir','yumurta','zeytin','yoğurt','tereyağ','bal','reçel']],['Et & tavuk',['et','tavuk','kıyma','balık','sucuk']],['Fırın & temel gıda',['ekmek','makarna','pirinç','bulgur','mercimek','şeker','salça','çay','kahve','kurabiye','un']]];
function reyonOf(name){const n=low(name),w=n.split(/\s+/);for(const [r,ks] of REYON)if(ks.some(k=>k.includes(' ')?n.includes(k):w.some(x=>x.startsWith(k))))return r;return 'Diğer'}
const catsOf=arr=>{const c={};arr.forEach(i=>c[i.cat]=(c[i.cat]||0)+1);return Object.entries(c).sort((a,b)=>(a[0]==='Market'?-1:b[0]==='Market'?1:b[1]-a[1]))};
