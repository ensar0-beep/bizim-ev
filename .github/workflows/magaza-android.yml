name: Mağaza — Android derleme

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ya3l9h]
    paths: ["magaza/**", "index.html", "yukle.html", "icons/**", "img/**", "vendor/**", ".github/workflows/magaza-android.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magaza
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: magaza/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android
      - name: Deneme APK'sı derle
        working-directory: magaza/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bizim-ev-deneme-apk
          path: magaza/android/app/build/outputs/apk/debug/*.apk
